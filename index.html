function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return c;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
}
function fillCirclePixel(g, cx, cy, r, color) {
  g.fillStyle = color;
  const r2 = r * r;
  for (let y = -r; y <= r; y++) {
    const span = Math.floor(Math.sqrt(Math.max(0, r2 - y * y)));
    if (span < 0) continue;
    g.fillRect(cx - span, cy + y, span * 2 + 1, 1);
  }
}
function drawShadowEllipse(g, cx, cy, rx, ry, color) {
  g.fillStyle = color;
  for (let y = -ry; y <= ry; y++) {
    const t = 1 - (y * y) / (ry * ry);
    if (t <= 0) continue;
    const w = Math.round(rx * Math.sqrt(t));
    if (w <= 0) continue;
    g.fillRect(cx - w, cy + y, w * 2, 1);
  }
}

const GLYPH_KEYS = Object.keys(GLYPHS);
const GLYPH_INDEX = {};

const fontAtlases = Object.create(null);
function getFontAtlas(color) {
  let a = fontAtlases[color];
  if (a) return a;
  const rows = Math.ceil(GLYPH_KEYS.length / FONT_COLS);
  const cv = makeCanvas(FONT_COLS * FONT_CW, rows * FONT_CH);
  const g = cv.getContext('2d');
  g.fillStyle = color;
  for (let i = 0; i < GLYPH_KEYS.length; i++) {
    const bits = GLYPHS[GLYPH_KEYS[i]];
    const ox = (i % FONT_COLS) * FONT_CW;
    const oy = Math.floor(i / FONT_COLS) * FONT_CH;
    for (let r = 0; r < FONT_H; r++) {
      const row = bits[r];
      for (let b = 0; b < FONT_W; b++) {
        if (row & (1 << (FONT_W - 1 - b))) g.fillRect(ox + b, oy + r, 1, 1);
      }
    }
  }
  fontAtlases[color] = cv;
  return cv;
}
function textWidth(str) { return str.length * FONT_CW - 1; }

function resize() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / W, window.innerHeight / H)));
  const dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
  display.width = W * s * dpr;
  display.height = H * s * dpr;
  display.style.width = (W * s) + 'px';
  display.style.height = (H * s) + 'px';
  dctx.imageSmoothingEnabled = false;
}
function present() {
  dctx.imageSmoothingEnabled = false;
  dctx.drawImage(buf, 0, 0, W, H, 0, 0, display.width, display.height);
}
function drawText(str, x, y, color) {
  str = String(str).toUpperCase();
  const atlas = getFontAtlas(color);
  let cx = Math.round(x);
  const cy = Math.round(y);
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    const idx = GLYPH_INDEX[ch];
    if (idx !== undefined && ch !== ' ') {
      const sx = (idx % FONT_COLS) * FONT_CW;
      const sy = Math.floor(idx / FONT_COLS) * FONT_CH;
      ctx.drawImage(atlas, sx, sy, FONT_CW, FONT_CH, cx, cy, FONT_CW, FONT_CH);
    }
    cx += FONT_CW;
  }
}
function drawTextCentered(str, cx, y, color) { drawText(str, Math.round(cx - textWidth(str) / 2), y, color); }
function drawPanel(x, y, w, h) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  ctx.fillStyle = 'rgba(26,20,18,0.94)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = C.uiBorder;
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
  ctx.fillStyle = C.uiGold;
  ctx.fillRect(x, y, 1, 1); ctx.fillRect(x + w - 1, y, 1, 1);
  ctx.fillRect(x, y + h - 1, 1, 1); ctx.fillRect(x + w - 1, y + h - 1, 1, 1);
}

/* ---------- 5. INPUT ---------- */
const Input = {
  keys: Object.create(null),
  init() {
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code) >= 0) e.preventDefault();
      if (e.repeat) return;
      this.keys[e.code] = true;
      AudioSys.userGesture();
      onKeyPressed(e.code);
    });
    window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in this.keys) this.keys[k] = false; });
  },
  isDown(code) { return !!this.keys[code]; }
};
const axisVec = { x: 0, y: 0 };
function getAxis() {
  let x = 0, y = 0;
  if (Input.isDown('KeyA') || Input.isDown('ArrowLeft'))  x -= 1;
  if (Input.isDown('KeyD') || Input.isDown('ArrowRight')) x += 1;
  if (Input.isDown('KeyW') || Input.isDown('ArrowUp'))    y -= 1;
  if (Input.isDown('KeyS') || Input.isDown('ArrowDown'))  y += 1;
  // Touch joystick override
  if (Touch.active && (!invUI.open && !shop.open && !CollectionSys.open && !game.paused)) { 
    x += Touch.axisX; y += Touch.axisY; 
  }
  if (x > 1) x = 1; if (x < -1) x = -1;
  if (y > 1) y = 1; if (y < -1) y = -1;
  axisVec.x = x; axisVec.y = y;
  return axisVec;
}

/* ---------- 8. INVENTARIS ---------- */
const inventory = {
  slots: new Array(20).fill(null),
  activeTool: 0,
  add(id, count) {
    count = count || 1;
    const item = ITEMS[id];
    if (!item) return false;
    const max = item.isTool ? 1 : 99;
    for (let i = 0; i < this.slots.length; i++) {
      const s = this.slots[i];
      if (s && s.id === id && s.count < max) {
        const add = Math.min(count, max - s.count);
        s.count += add; count -= add;
        if (count <= 0) return true;
      }
    }
    for (let i = 0; i < this.slots.length; i++) {
      if (!this.slots[i]) {
        const add = Math.min(count, max);
        this.slots[i] = { id, count: add };
        count -= add;
        if (count <= 0) return true;
      }
    }
    return false;
  },
  removeAt(idx, count) {
    count = count || 1;
    const s = this.slots[idx];
    if (!s) return false;
    s.count -= count;
    if (s.count <= 0) this.slots[idx] = null;
    return true;
  },
  getActive() { return this.slots[this.activeTool]; },
  cycleTool() {
    for (let n = 1; n <= 5; n++) {
      const idx = (this.activeTool + n) % 5;
      if (this.slots[idx]) { this.activeTool = idx; return; }
    }
  }
};

const Weather = {
  type: 'sunny', timer: 90, particles: [], fireflies: [],
  update(dt) {
    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = 120 + Math.random() * 180;
      const r = Math.random();
      if (r < 0.6) this.type = 'sunny';
      else if (r < 0.85) this.type = 'rain';
      else this.type = 'windy';
      this.initParticles();
    }
    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      if (this.type === 'rain') {
        p.y += p.spd * dt;
        if (p.y > H) { p.y = -4; p.x = Math.random() * W; }
      } else {
        p.x += p.vx * dt;
        p.y += p.vy * dt + Math.sin(game.time * 2 + p.ph) * 12 * dt;
        if (p.x > W + 8) { p.x = -8; p.y = Math.random() * H; }
      }
    }
    
    // Kunang-kunang malam
    if (player.scene === 'world' && (TimeSys.hour >= 18 || TimeSys.hour < 5)) {
      if (this.fireflies.length < 15 && Math.random() < 0.04) {
         this.fireflies.push({
             x: camera.x + Math.random() * W, 
             y: camera.y + Math.random() * H, 
             vx: (Math.random() - 0.5) * 12, 
             vy: (Math.random() - 0.5) * 4, 
             life: 6 + Math.random() * 4
         });
      }
    }
    for (let i = this.fireflies.length - 1; i >= 0; i--) {
      let f = this.fireflies[i];
      f.x += f.vx * dt;
      f.y += f.vy * dt + Math.sin(game.time * 2 + f.x) * 10 * dt;
      f.life -= dt;
      if (f.life <= 0) this.fireflies.splice(i, 1);
    }
  },
  initParticles() {
    this.particles = [];
    if (this.type === 'rain') {
      for (let i = 0; i < 50; i++) this.particles.push({ x: Math.random() * W, y: Math.random() * H, spd: 220 + Math.random() * 100 });
    } else if (this.type === 'windy') {
      for (let i = 0; i < 14; i++) this.particles.push({ x: Math.random() * W, y: Math.random() * H, vx: 40 + Math.random() * 40, vy: Math.random() * 8, ph: Math.random() * 6, color: Math.random() < 0.5 ? C.leaf1 : C.leaf3 });
    }
  },
  render() {
    if (this.type === 'rain') {
      ctx.fillStyle = 'rgba(140,170,200,0.55)';
      for (let i = 0; i < this.particles.length; i++) {
        const p = this.particles[i];
        ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 3);
      }
    } else if (this.type === 'windy') {
      for (let i = 0; i < this.particles.length; i++) {
        const p = this.particles[i];
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 1);
      }
    }
  },
  renderFireflies() {
    if (player.scene === 'world' && (TimeSys.hour >= 18 || TimeSys.hour < 5)) {
      ctx.fillStyle = '#dbff5c'; // kuning-kehijauan neon
      for (let f of this.fireflies) {
          const alpha = Math.max(0, Math.min(1, f.life)) * (0.6 + 0.4 * Math.sin(game.time * 5 + f.x));
          ctx.globalAlpha = alpha;
          ctx.fillRect(Math.round(f.x - camera.x), Math.round(f.y - camera.y), 2, 2);
      }
      ctx.globalAlpha = 1;
    }
  },
  getTint() {
    if (this.type === 'rain')  return { r: 80, g: 100, b: 130, a: 0.25 };
    if (this.type === 'windy') return { r: 200, g: 220, b: 180, a: 0.05 };
    return null;
  }
};

/* ---------- 26. AUDIO (Web Audio API) ---------- */
const AudioSys = {
  ctx: null, master: null, muted: false, ambient: null, ambientTimer: 0, ambientIndex: 0,
  init() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.4;
      this.master.connect(this.ctx.destination);
      return true;
    } catch (e) { return false; }
  },
  userGesture() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.4;
  },
  toggleMute() {
    this.setMuted(!this.muted);
    message.show(this.muted ? 'SUARA MATI' : 'SUARA HIDUP', 1.2);
  },
  playSfx(name) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    const mk = (freq, type, dur, vol, slide) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    };
    switch (name) {
      case 'dialog': mk(520, 'square', 0.06, 0.08); break;
      case 'gift':   mk(660, 'square', 0.10, 0.12); setTimeout(() => mk(880, 'square', 0.15, 0.12), 90); break;
      case 'catch':  mk(700, 'square', 0.08, 0.14); setTimeout(() => mk(1000, 'square', 0.10, 0.14), 60); setTimeout(() => mk(1320, 'square', 0.14, 0.14), 130); break;
      case 'cast':   mk(400, 'triangle', 0.12, 0.10, 0.5); break;
      case 'bite':   mk(900, 'square', 0.08, 0.14); setTimeout(() => mk(1200, 'square', 0.08, 0.14), 70); break;
      case 'miss':   mk(300, 'sawtooth', 0.20, 0.10, 0.5); break;
      case 'dig':    mk(220, 'square', 0.10, 0.10, 0.7); break;
      case 'chop':   mk(160, 'square', 0.10, 0.12, 0.5); break;
      case 'treefall': mk(120, 'sawtooth', 0.4, 0.15, 0.4); break;
      case 'plant':  mk(500, 'triangle', 0.10, 0.10); setTimeout(() => mk(750, 'triangle', 0.10, 0.10), 80); break;
      case 'buy':    mk(880, 'square', 0.08, 0.12); setTimeout(() => mk(1100, 'square', 0.10, 0.12), 60); break;
      case 'sell':   mk(1100, 'square', 0.08, 0.12); setTimeout(() => mk(880, 'square', 0.10, 0.12), 60); break;
      case 'error':  mk(200, 'sawtooth', 0.15, 0.10); break;
      case 'menu':   mk(660, 'square', 0.05, 0.08); break;
      case 'enter':  mk(500, 'triangle', 0.15, 0.12); setTimeout(() => mk(750, 'triangle', 0.2, 0.12), 120); break;
    }
  },
  tickAmbient(dt) {
    if (!this.ctx || this.muted) return;
    this.ambientTimer -= dt;
    if (this.ambientTimer <= 0) {
      this.ambientTimer = 3.6 + Math.random() * 1.2;
      // Simple pentatonic arpeggio
      const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
      const note = scale[this.ambientIndex % scale.length];
      this.ambientIndex++;
      const c = this.ctx, t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(note, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.06, t + 0.4);
      g.gain.exponentialRampToValueAtTime(0.001, t + 2.0);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + 2.1);
    }
  }
};

    const btnT = { x: W - 32, y: H - 82, w: 28, h: 28, id: 'T', text: 'ALAT' }; // Q
    const btnC = { x: W - 60, y: 10, w: 20, h: 20, id: 'C', text: 'BUKU' }; // C
    const btnEsc = { x: W - 30, y: 10, w: 20, h: 20, id: 'ESC', text: '||' }; // Esc
    this.buttons = [btnA, btnB, btnT, btnC, btnEsc];

    const findTouch = (touches, region) => {
      for (let i = 0; i < touches.length; i++) {
        const rect = c.getBoundingClientRect();
        const tx = (touches[i].clientX - rect.left) / rect.width * W;
        const ty = (touches[i].clientY - rect.top) / rect.height * H;
        if (tx >= region.x && tx <= region.x + region.w && ty >= region.y && ty <= region.y + region.h) return { tx, ty };
      }
      return null;
    };
    
    const joyRegion = { x: 0, y: H - 90, w: 90, h: 90 };
    
    const handleStart = (e) => {
      e.preventDefault();
      AudioSys.userGesture();
      const touches = e.touches;
      
      // Check UI full-screen taps for advancement
      if (game.state === 'title' || !game.tutorialShown || dialog.active || fishing.state === 'minigame' || fishing.state === 'bite') {
         // Cek jika menekan tombol spesifik B di Title (Load game)
         if (game.state === 'title' && findTouch(touches, btnB)) { onKeyPressed('KeyL'); return; }
         onKeyPressed('KeyE');
         return;
      }
      
      // joystick
      const jt = findTouch(touches, joyRegion);
      if (jt) { this.joyActive = true; this.joyStartX = jt.tx; this.joyStartY = jt.ty; this.joyCurX = jt.tx; this.joyCurY = jt.ty; }
      
      // buttons
      for (const b of this.buttons) {
        if (findTouch(touches, b)) this.handleButton(b.id);
      }
    };
    const handleMove = (e) => {
      e.preventDefault();
      if (!this.joyActive) return;
      const touches = e.touches;
      // use any touch to update joystick
      for (let i = 0; i < touches.length; i++) {
        const rect = c.getBoundingClientRect();
        const tx = (touches[i].clientX - rect.left) / rect.width * W;
        const ty = (touches[i].clientY - rect.top) / rect.height * H;
        const dx = tx - this.joyStartX, dy = ty - this.joyStartY;
        const len = Math.hypot(dx, dy);
        if (len < 60) {
          this.joyCurX = tx; this.joyCurY = ty;
          const nx = dx / 25, ny = dy / 25;
          this.axisX = Math.max(-1, Math.min(1, nx));
          this.axisY = Math.max(-1, Math.min(1, ny));
          return;
        }
      }
    };
    const handleEnd = (e) => {
      e.preventDefault();
      if (e.touches.length === 0) { this.joyActive = false; this.axisX = 0; this.axisY = 0; }
    };
    c.addEventListener('touchstart', handleStart, { passive: false });
    c.addEventListener('touchmove', handleMove, { passive: false });
    c.addEventListener('touchend', handleEnd, { passive: false });
    c.addEventListener('touchcancel', handleEnd, { passive: false });
  },
  handleButton(id) {
    if (id === 'A') onKeyPressed('KeyE');
    else if (id === 'B') {
      if (shop.open) onKeyPressed('Tab');
      else onKeyPressed('KeyI');
    }
    else if (id === 'T') onKeyPressed('KeyQ');
    else if (id === 'C') onKeyPressed('KeyC');
    else if (id === 'ESC') onKeyPressed('Escape');
  },
  updateUI(dt) {
    if (this.uiCooldown > 0) this.uiCooldown -= dt;
    if (this.joyActive && this.uiCooldown <= 0) {
      if (invUI.open || shop.open || CollectionSys.open) {
         if (this.axisX > 0.5) { onKeyPressed('ArrowRight'); this.uiCooldown = 0.25; }
         else if (this.axisX < -0.5) { onKeyPressed('ArrowLeft'); this.uiCooldown = 0.25; }
         else if (this.axisY > 0.5) { onKeyPressed('ArrowDown'); this.uiCooldown = 0.25; }
         else if (this.axisY < -0.5) { onKeyPressed('ArrowUp'); this.uiCooldown = 0.25; }
      }
    }
  },
  render() {
    if (!this.active) return;
    // Joystick
    const jx = 45, jy = H - 45;
    ctx.strokeStyle = 'rgba(243,227,200,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(jx, jy, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(26,20,18,0.6)';
    ctx.beginPath(); ctx.arc(jx, jy, 26, 0, Math.PI * 2); ctx.fill();
    const kx = jx + this.axisX * 16, ky = jy + this.axisY * 16;
    ctx.fillStyle = 'rgba(255,207,107,0.85)';
    ctx.beginPath(); ctx.arc(kx, ky, 10, 0, Math.PI * 2); ctx.fill();
    // Buttons
    for (const b of this.buttons) {
      ctx.fillStyle = 'rgba(26,20,18,0.75)';
      ctx.beginPath(); ctx.arc(b.x + b.w/2, b.y + b.h/2, b.w/2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(243,227,200,0.8)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x + b.w/2, b.y + b.h/2, b.w/2, 0, Math.PI * 2); ctx.stroke();
      drawTextCentered(b.text, b.x + b.w/2, b.y + b.h/2 - 3, C.uiGold);
    }
  }
};

/* ---------- 28. SAVE / LOAD ---------- */
const SaveSys = {
  save() {
    try {
      const data = {
        v: SAVE_VERSION,
        player: { x: player.x, y: player.y, scene: player.scene, dir: player.dir },
        money: money.amount,
        inventory: inventory.slots.map(s => s ? { id: s.id, count: s.count } : null),
        activeTool: inventory.activeTool,
        npcAffinity: npcs.map(n => n.affinity),
        collection: CollectionSys.caught,
        weather: { type: Weather.type, timer: Weather.timer },
        day: TimeSys.day,
        tutorialShown: game.tutorialShown
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      return true;
    } catch (e) { return false; }
  },
  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data || data.v !== SAVE_VERSION) return false;
      // Validasi
      if (typeof data.player?.x !== 'number' || typeof data.player?.y !== 'number') return false;
      if (!Array.isArray(data.inventory) || data.inventory.length !== 20) return false;
      // Terapkan
      player.x = data.player.x;
      player.y = data.player.y;
      player.scene = data.player.scene === 'interior' ? 'interior' : 'world';
      player.dir = ['down','up','left','right'].includes(data.player.dir) ? data.player.dir : 'down';
      money.amount = typeof data.money === 'number' ? data.money : 100;
      for (let i = 0; i < 20; i++) {
        const s = data.inventory[i];
        if (s && typeof s.id === 'string' && ITEMS[s.id] && typeof s.count === 'number' && s.count > 0) {
          inventory.slots[i] = { id: s.id, count: s.count };
        } else inventory.slots[i] = null;
      }
      inventory.activeTool = typeof data.activeTool === 'number' ? Math.max(0, Math.min(4, data.activeTool)) : 0;
      if (Array.isArray(data.npcAffinity)) {
        for (let i = 0; i < npcs.length && i < data.npcAffinity.length; i++) {
          npcs[i].affinity = typeof data.npcAffinity[i] === 'number' ? data.npcAffinity[i] : 0;
        }
      }
      if (data.collection && typeof data.collection === 'object') {
        CollectionSys.caught = data.collection;
      }
      if (data.weather && typeof data.weather.type === 'string') {
        Weather.type = ['sunny','rain','windy'].includes(data.weather.type) ? data.weather.type : 'sunny';
        Weather.timer = typeof data.weather.timer === 'number' ? data.weather.timer : 90;
        Weather.initParticles();
      }
      game.tutorialShown = !!data.tutorialShown;
      return true;
    } catch (e) { return false; }
  },
  clear() {
    try { localStorage.removeItem(SAVE_KEY); return true; } catch (e) { return false; }
  },
  exists() {
    try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  }
};
let autoSaveTimer = 0;
function autoSaveTick(dt) {
  if (game.state !== 'play' || game.paused) return;
  autoSaveTimer += dt;
  if (autoSaveTimer >= 30) { autoSaveTimer = 0; SaveSys.save(); }
}

/* ---------- 29. INTERAKSI UTAMA ---------- */
function findNearestNPC() {
  let nearest = null, bestDist = INTERACT_RADIUS;
  for (let i = 0; i < npcs.length; i++) {
    const d = Math.hypot(npcs[i].x - player.x, npcs[i].y - player.y);
    if (d < bestDist) { bestDist = d; nearest = npcs[i]; }
  }
  return nearest;
}
function nearShopSign() { if (!shopSign) return false; return Math.hypot(shopSign.cx - player.x, shopSign.cy - player.y) < 20; }
function nearHouseDoor() {
  for (let i = 0; i < objects.length; i++) {
    const o = objects[i];
    if (o.type !== 'house') continue;
    if (Math.hypot(o.doorX - player.x, o.doorY - player.y) < 18) return o;
  }
  return null;
}
function interact() {
  if (player.scene === 'interior') {
    const pty = Math.floor(player.y / TILE);
    if (pty >= IN_H - 1) { exitHouse(); return; }
    message.show('TIDAK ADA APA-APA', 1.0);
    return;
  }
  const npc = findNearestNPC();
  if (npc) { startDialog(npc); return; }
  if (nearShopSign()) { shop.open = true; shop.tab = 0; shop.cursor = 0; AudioSys.playSfx('menu'); return; }
  const house = nearHouseDoor();
  if (house) { enterHouse(); return; }
  const slot = inventory.getActive();
  if (!slot) { message.show('TANGAN KOSONG', 1.0); return; }
  const toolId = slot.id;
  if (toolId === 'rod') { startFishing(); return; }
  if (toolId === 'net') { tryCatchBug(); return; }
  if (toolId === 'shovel') { tryDig(); return; }
  if (toolId === 'axe') { tryChop(); return; }
  if (toolId === 'water') { message.show('PENYIRAM DIPAKAI', 1.0); return; }
  if (toolId === 'seed_bunga') { tryPlant(); return; }
  message.show(ITEMS[toolId].name.toUpperCase() + ' DIPAKAI', 1.0);
}
function enterHouse() {
  player.scene = 'interior';
  player.x = interior.entryTX * TILE + 8;
  player.y = interior.entryTY * TILE + TILE - 2;
  player.dir = 'up';
  AudioSys.playSfx('enter');
  SaveSys.save();
}
function exitHouse() {
  player.scene = 'world';
  const house = objects.find(o => o.type === 'house');
  if (house) { player.x = house.doorX; player.y = house.doorY + 12; }
  player.dir = 'down';
  AudioSys.playSfx('enter');
}

/* ---------- 30. KAMERA ---------- */
const camera = { x: 0, y: 0 };
function clampCamX(v) { return Math.max(0, Math.min(WORLD_W - W, v)); }
function clampCamY(v) { return Math.max(0, Math.min(WORLD_H - H, v)); }
function snapCamera() {
  if (player.scene === 'interior') { camera.x = (IN_W * TILE - W) / 2; camera.y = (IN_H * TILE - H) / 2; }
  else { camera.x = clampCamX(player.x - W / 2); camera.y = clampCamY(player.y - H / 2); }
}
function updateCamera(dt) {
  if (player.scene === 'interior') { camera.x = (IN_W * TILE - W) / 2; camera.y = (IN_H * TILE - H) / 2; return; }
  const tx = clampCamX(player.x - W / 2), ty = clampCamY(player.y - H / 2);
  camera.x += (tx - camera.x) * 0.14;
  camera.y += (ty - camera.y) * 0.14;
  camera.x = clampCamX(camera.x); camera.y = clampCamY(camera.y);
}

/* ---------- 31. RENDER DUNIA ---------- */
const renderList = [];
const playerRender = { x: 0, y: 0, img: null, sortY: 0, isPlayer: true };
let waterFrame = 0;
function renderWorld() {
  const camX = Math.round(camera.x), camY = Math.round(camera.y);
  ctx.drawImage(worldGround, camX, camY, W, H, 0, 0, W, H);
  const tx0 = Math.max(0, Math.floor(camX / TILE)), ty0 = Math.max(0, Math.floor(camY / TILE));
  const tx1 = Math.min(MAP_W - 1, Math.floor((camX + W) / TILE)), ty1 = Math.min(MAP_H - 1, Math.floor((camY + H) / TILE));
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const i = ty * MAP_W + tx;
    if (ground[i] === T.WATER) { const img = assets.water[waterVariant[i]][waterFrame]; ctx.drawImage(img, tx * TILE - camX, ty * TILE - camY); }
  }
  for (let i = 0; i < flowers.length; i++) {
    const f = flowers[i];
    if (f.x + 16 < camX || f.x > camX + W || f.y + 16 < camY || f.y > camY + H) continue;
    const fr = (Math.floor(game.time * 1.6 + f.phase) & 1);
    ctx.drawImage(f.img[fr], f.x - camX, f.y - camY);
  }
  // foot particles
  for (let i = 0; i < footParticles.length; i++) {
    const p = footParticles[i];
    const alpha = Math.max(0, p.life / 0.4) * 0.5;
    ctx.fillStyle = 'rgba(120,90,70,' + alpha + ')';
    ctx.fillRect(Math.round(p.x - camX), Math.round(p.y - camY + 14), 2, 1);
  }
  for (let i = 0; i < digSpots.length; i++) {
    const d = digSpots[i];
    const dx = d.x - 4 - camX, dy = d.y - 2 - camY;
    if (dx < -16 || dx > W || dy < -16 || dy > H) continue;
    ctx.fillStyle = '#7d5738'; ctx.fillRect(dx + 1, dy + 2, 6, 2);
    ctx.fillStyle = '#5a3a20'; ctx.fillRect(dx + 1, dy + 4, 6, 1);
    ctx.fillStyle = '#a3764f'; ctx.fillRect(dx + 2, dy + 3, 4, 1);
  }
  renderList.length = 0;
  for (let i = 0; i < objects.length; i++) {
    const o = objects[i];
    if (o.x + o.img.width < camX || o.x > camX + W) continue;
    if (o.y + o.img.height < camY || o.y > camY + H) continue;
    renderList.push(o);
  }
  for (let i = 0; i < bugs.length; i++) {
    const b = bugs[i];
    if (b.x < camX - 16 || b.x > camX + W + 16 || b.y < camY - 16 || b.y > camY + H + 16) continue;
    const bf = Math.floor(b.phase) & 1;
    const sp = bugSprites[b.id + '_' + bf];
    if (sp) { ctx.drawImage(sp, Math.round(b.x - 6 - camX), Math.round(b.y - 6 - camY)); }
  }
  for (let i = 0; i < npcs.length; i++) {
    const npc = npcs[i];
    if (npc.x - 8 + 16 < camX || npc.x - 8 > camX + W) continue;
    if (npc.y - 16 + 16 < camY || npc.y - 16 > camY + H) continue;
    const ro = npc.renderObj;
    ro.x = Math.round(npc.x - 8); ro.y = Math.round(npc.y - 16);
    ro.img = npc.sprites[npc.dir][npc.frame]; ro.sortY = Math.round(npc.y);
    renderList.push(ro);
  }
  playerRender.x = Math.round(player.x - 8); playerRender.y = Math.round(player.y - 16);
  playerRender.img = assets.player[player.dir][player.frame]; playerRender.sortY = Math.round(player.y);
  renderList.push(playerRender);
  renderList.sort((a, b) => a.sortY - b.sortY);
  for (let i = 0; i < renderList.length; i++) {
    const o = renderList[i];
    const dx = Math.round(o.x - camX), dy = Math.round(o.y - camY);
    if (o.isPlayer || o.isNPC) ctx.drawImage(playerShadow, dx, dy + 12);
    ctx.drawImage(o.img, dx, dy);
  }
  if (fishing.state === 'waiting' || fishing.state === 'bite' || fishing.state === 'casting') {
    const sx = Math.round(player.x - camX), sy = Math.round(player.y - camY - 4);
    const ex = Math.round(fishing.castX - camX), ey = Math.round(fishing.castY - camY);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    const steps = Math.max(Math.abs(ex - sx), Math.abs(ey - sy));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      ctx.fillRect(Math.round(sx + (ex - sx) * t), Math.round(sy + (ey - sy) * t), 1, 1);
    }
    if (fishing.state === 'bite') drawText('!', ex - 1, ey - 10, C.uiGold);
  }
}
function renderInterior() {
  const camX = Math.round(camera.x), camY = Math.round(camera.y);
  ctx.fillStyle = '#1a1412'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(interior.canvas, camX, camY);
  const px = Math.round(player.x - 8 - camX), py = Math.round(player.y - 16 - camY);
  ctx.drawImage(playerShadow, px, py + 12);
  ctx.drawImage(assets.player[player.dir][player.frame], px, py);
}
function applyTint() {
  const t1 = TimeSys.getTint(), t2 = Weather.getTint();
  if (t1 && t1.a > 0) { ctx.fillStyle = 'rgba(' + t1.r + ',' + t1.g + ',' + t1.b + ',' + t1.a + ')'; ctx.fillRect(0, 0, W, H); }

}

  const tw = textWidth(message.text) + 10;
  const tx = Math.round((W - tw) / 2);
  drawPanel(tx, 40, tw, 14);
  drawTextCentered(message.text, W / 2, 44, C.uiText);
}
function renderFishingUI() {
  if (fishing.state === 'idle') return;
  if (fishing.state === 'casting') drawTextCentered('MELEMPAR KAIL...', W / 2, 70, C.uiText);
  else if (fishing.state === 'waiting') drawTextCentered('MENUNGGU IKAN...', W / 2, 70, C.uiText);
  else if (fishing.state === 'bite') {
    drawTextCentered('! TARIK SEKARANG !', W / 2, 60, C.uiGold);
    if ((Math.floor(game.time * 8) & 1) === 0) drawTextCentered(Touch.active ? 'TEKAN A' : 'TEKAN E', W / 2, 72, C.uiText);
  } else if (fishing.state === 'minigame') {
    const bw = 160, bh = 8;
    const bx = Math.round((W - bw) / 2), by = 86;
    ctx.fillStyle = 'rgba(26,20,18,0.92)'; ctx.fillRect(bx - 2, by - 10, bw + 4, bh + 24);
    ctx.fillStyle = '#2a1e16'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = C.uiGreen; ctx.fillRect(bx + Math.round(bw * 0.35), by, Math.round(bw * 0.30), bh);
    const cx = bx + Math.round((fishing.cursor / 100) * bw);
    ctx.fillStyle = C.uiGold; ctx.fillRect(cx - 1, by - 2, 3, bh + 4);
    drawTextCentered(Touch.active ? 'TEKAN A DI ZONA HIJAU' : 'TEKAN E DI ZONA HIJAU', W / 2, by + bh + 4, C.uiText);
  } else if (fishing.state === 'result') drawTextCentered(fishing.result, W / 2, 70, C.uiGold);
}
function renderShop() {
  if (!shop.open) return;
  ctx.fillStyle = 'rgba(16,12,10,0.65)'; ctx.fillRect(0, 0, W, H);
  const pw = 200, ph = 140;
  const px = Math.round((W - pw) / 2), py = Math.round((H - ph) / 2);
  drawPanel(px, py, pw, ph);
  drawTextCentered('TOKO EMBUN', W / 2, py + 6, C.uiGold);
  const tabY = py + 18, tabW = 60;
  for (let t = 0; t < 2; t++) {
    const tx = px + 10 + t * (tabW + 4);
    const isSel = shop.tab === t;
    ctx.fillStyle = isSel ? 'rgba(255,207,107,0.20)' : 'rgba(20,15,13,0.7)';
    ctx.fillRect(tx, tabY, tabW, 12);
    ctx.fillStyle = isSel ? C.uiGold : C.uiDim;
    ctx.fillRect(tx, tabY, tabW, 1); ctx.fillRect(tx, tabY + 11, tabW, 1);
    ctx.fillRect(tx, tabY, 1, 12); ctx.fillRect(tx + tabW - 1, tabY, 1, 12);
    drawText(t === 0 ? 'BELI' : 'JUAL', tx + (tabW >> 1) - 12, tabY + 3, isSel ? C.uiGold : C.uiDim);
  }
  const lx = px + 10; let ly = tabY + 18;
  if (shop.tab === 0) {
    for (let i = 0; i < shop.buyList.length; i++) {
      const it = shop.buyList[i], isSel = i === shop.cursor;
      ctx.fillStyle = isSel ? 'rgba(255,207,107,0.18)' : 'rgba(0,0,0,0.25)';
      ctx.fillRect(lx, ly, pw - 20, 14);
      if (itemIcons[it.id]) ctx.drawImage(itemIcons[it.id], lx + 2, ly - 1);
      drawText(ITEMS[it.id].name, lx + 20, ly + 4, isSel ? C.uiGold : C.uiText);
      drawText(String(it.price) + 'K', px + pw - 24, ly + 4, C.uiGold);
      ly += 16;
    }
  } else {
    for (let i = 0; i < 8; i++) {
      const slot = inventory.slots[i], isSel = i === shop.cursor;
      ctx.fillStyle = isSel ? 'rgba(255,207,107,0.18)' : 'rgba(0,0,0,0.25)';
      ctx.fillRect(lx, ly, pw - 20, 12);
      if (slot && itemIcons[slot.id]) {
        ctx.drawImage(itemIcons[slot.id], lx + 2, ly - 1);
        drawText(ITEMS[slot.id].name, lx + 20, ly + 3, isSel ? C.uiGold : C.uiText);
        drawText('+' + getSellPrice(slot.id) + 'K', px + pw - 24, ly + 3, C.uiGold);
      } else drawText('-KOSONG-', lx + 20, ly + 3, C.uiDim);
      ly += 13;
    }
  }
  drawText('KEPING: ' + money.amount, lx, py + ph - 22, C.uiGold);
  drawTextCentered(Touch.active ? 'A: BELI/JUAL   B: GANTI TAB   ESC: TUTUP' : 'ENTER: AKSI   TAB: UBAH   ESC: TUTUP', W / 2, py + ph - 11, C.uiDim);
}
function renderCollection() {
  if (!CollectionSys.open) return;
  ctx.fillStyle = 'rgba(16,12,10,0.72)'; ctx.fillRect(0, 0, W, H);
  const pw = 220, ph = 140;
  const px = Math.round((W - pw) / 2), py = Math.round((H - ph) / 2);
  drawPanel(px, py, pw, ph);
  drawTextCentered('ENSIKLOPEDIA', W / 2, py + 6, C.uiGold);
  drawTextCentered('IKAN & SERANGGA', W / 2, py + 16, C.uiDim);
  const list = CollectionSys.list;
  const colW = (pw - 16) / 2;
  let y0 = py + 30;
  for (let i = 0; i < list.length; i++) {
    const id = list[i], col = i < 5 ? 0 : 1, row = i % 5;
    const lx = px + 8 + col * colW, ly = y0 + row * 18;
    const caught = CollectionSys.has(id);
    ctx.fillStyle = caught ? 'rgba(138,223,122,0.15)' : 'rgba(0,0,0,0.25)';
    ctx.fillRect(lx, ly, colW - 6, 16);
    if (itemIcons[id]) {
      ctx.globalAlpha = caught ? 1 : 0.30;
      ctx.drawImage(itemIcons[id], lx + 2, ly);
      ctx.globalAlpha = 1;
    }
    drawText(caught ? ITEMS[id].name : '???', lx + 20, ly + 5, caught ? C.uiText : C.uiDim);
  }
  drawTextCentered('ESC / BUKU: TUTUP', W / 2, py + ph - 11, C.uiGold);
}
function renderPause() {
  ctx.fillStyle = 'rgba(16,12,10,0.60)'; ctx.fillRect(0, 0, W, H);
  const pw = 200, ph = 130;
  const px = (W - pw) >> 1, py = (H - ph) >> 1;
  drawPanel(px, py, pw, ph);
  drawTextCentered('JEDA', W / 2, py + 8, C.uiGold);
  
  if (Touch.active) {
    const lines = ['JOYSTICK : BERJALAN / NAVIGASI','TOMBOL A : INTERAKSI / OK','TOMBOL B : BUKA TAS / KEMBALI','TOMBOL T : GANTI ALAT','TOMBOL C : ENSIKLOPEDIA'];
    for (let i = 0; i < lines.length; i++) drawText(lines[i], px + 8, py + 22 + i * 11, C.uiText);
  } else {
    const lines = ['WASD / PANAH : BERJALAN','E / SPASI    : INTERAKSI','Q / 1-5      : GANTI ALAT','I : TAS    C : ENSIKLOPEDIA','M : SUARA   F : SIMPAN'];
    for (let i = 0; i < lines.length; i++) drawText(lines[i], px + 8, py + 22 + i * 9, C.uiText);
  }
  drawText('WAKTU: ' + TimeSys.format() + ' ' + TimeSys.getPhase(), px + 8, py + ph - 22, C.uiDim);
  drawTextCentered('ESC / || UNTUK LANJUT', W / 2, py + ph - 11, C.uiGold);
}
function renderTutorial() {
  if (game.tutorialShown) return;
  ctx.fillStyle = 'rgba(16,12,10,0.72)'; ctx.fillRect(0, 0, W, H);
  const pw = 240, ph = 110;
  const px = (W - pw) >> 1, py = (H - ph) >> 1;
  drawPanel(px, py, pw, ph);
  drawTextCentered('SELAMAT DATANG DI', W / 2, py + 8, C.uiDim);
  drawTextCentered('PONDOK EMBUN', W / 2, py + 18, C.uiGold);
  
  const lines = Touch.active 
    ? ['SENTUH JOYSTICK KIRI : BERJALAN', 'SENTUH TOMBOL A KANAN: INTERAKSI', 'TOMBOL T : GANTI ALAT', 'TOMBOL B : BUKA TAS/INVENTARIS', 'CARI PENDUDUK & BICARA!']
    : ['WASD / PANAH : BERJALAN', 'E / SPASI    : BICARA & PAKAI ALAT', 'Q / 1-5      : GANTI ALAT', 'I : TAS   C : ENSIKLOPEDIA', 'CARI PENDUDUK & BICARA!'];
    
  for (let i = 0; i < lines.length; i++) drawTextCentered(lines[i], W / 2, py + 32 + i * 10, i === lines.length-1 ? C.uiGold : C.uiText);
  
  if ((Math.floor(game.time * 2) & 1) === 0) drawTextCentered(Touch.active ? 'SENTUH LAYAR / A UNTUK MULAI' : 'TEKAN E UNTUK MULAI', W / 2, py + ph - 11, C.uiGold);
}
function renderTitle() {
  if (worldGround) renderWorld();
  else { ctx.fillStyle = C.grass1; ctx.fillRect(0, 0, W, H); }
  applyTint();
  ctx.fillStyle = 'rgba(20,15,13,0.66)'; ctx.fillRect(0, 0, W, H);
  const pw = 232, ph = 130;
  const px = (W - pw) >> 1, py = (H - ph) >> 1;
  drawPanel(px, py, pw, ph);
  drawTextCentered('PONDOK EMBUN', W / 2, py + 12, C.uiGold);
  drawTextCentered('DESA KECIL YANG HANGAT', W / 2, py + 26, C.uiDim);
  ctx.fillStyle = C.uiBorder; ctx.fillRect(px + 16, py + 40, pw - 32, 1);
  if ((Math.floor(game.time * 2) & 1) === 0) drawTextCentered(Touch.active ? 'SENTUH LAYAR / A UNTUK MULAI' : 'TEKAN ENTER UNTUK MULAI', W / 2, py + 54, C.uiText);
  if (game.hasSave) drawTextCentered(Touch.active ? 'SENTUH TOMBOL B UNTUK LANJUTKAN' : 'L: LANJUTKAN PERMAINAN', W / 2, py + 70, C.uiGreen);
  drawTextCentered('ENHANCED MOBILE EDITION', W / 2, py + 98, C.uiGold);
  drawTextCentered('ORISINAL - TANPA ASET EKSTERNAL', W / 2, py + 112, C.uiDim);
}

/* ---------- 33. LOOP ---------- */
let lastTime = 0, accumulator = 0, rafId = 0;
function update(dt) {
  game.time += dt;
  if (game.paused) return;
  TimeSys.update();
  Weather.update(dt);
  AudioSys.tickAmbient(dt);
  updateDialog(dt);
  updateFishing(dt);
  
  if (Touch.active) Touch.updateUI(dt);

  if (!game.tutorialShown) return; // pause semua saat tutorial
  if (fishing.state === 'idle' && !dialog.active && !invUI.open && !shop.open && !CollectionSys.open) {
    updatePlayer(dt);
    updateNPCs(dt);
  }
  updateBugs(dt);
  updateDigSpots(dt);
  updateFootParticles(dt);
  updateCamera(dt);
  waterFrame = Math.floor(game.time * 4) % 3;
  if (message.timer > 0) message.timer -= dt;
  autoSaveTick(dt);
}
function render() {
  ctx.clearRect(0, 0, W, H);
  if (game.state === 'title') { renderTitle(); if (Touch.active) Touch.render(); present(); return; }
  if (player.scene === 'interior') renderInterior();
  else renderWorld();
  applyTint();
  renderHUD();
  renderHotbar();
  renderMessage();
  renderFishingUI();
  if (invUI.open) renderInventory();
  else if (dialog.active) renderDialog();
  if (shop.open) renderShop();
  if (CollectionSys.open) renderCollection();
  if (game.paused) renderPause();
  if (!game.tutorialShown) renderTutorial();
  if (Touch.active) Touch.render();
  present();
}
function frame(now) {
  rafId = requestAnimationFrame(frame);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.25) dt = 0.25;
  if (!game.paused) {
    accumulator += dt;
    let steps = 0;
    while (accumulator >= STEP && steps < 5) { update(STEP); accumulator -= STEP; steps++; }
    if (steps >= 5) accumulator = 0;
  } else game.time += dt;
  render();
}

/* ---------- 34. INPUT HANDLER ---------- */
function onKeyPressed(code) {
  // Tutorial dismiss
  if (!game.tutorialShown && game.state === 'play') {
    if (code === 'KeyE' || code === 'Space' || code === 'Enter') {
      game.tutorialShown = true;
      AudioSys.playSfx('menu');
      SaveSys.save();
    }
    return;
  }
  if (fishing.state === 'bite' || fishing.state === 'minigame') {
    if (code === 'KeyE' || code === 'Space') { fishingPress(); return; }
  }
  if (fishing.state !== 'idle') { if (code === 'Escape') fishing.state = 'idle'; return; }
  if (shop.open) {
    if (code === 'Escape') { shop.open = false; AudioSys.playSfx('menu'); return; }
    if (code === 'Tab') { shop.tab = (shop.tab + 1) % 2; shop.cursor = 0; AudioSys.playSfx('menu'); return; }
    if (code === 'ArrowUp' || code === 'KeyW') shop.cursor = Math.max(0, shop.cursor - 1);
    else if (code === 'ArrowDown' || code === 'KeyS') {
      const max = shop.tab === 0 ? shop.buyList.length - 1 : 7;
      shop.cursor = Math.min(max, shop.cursor + 1);
    }
    else if (code === 'Enter' || code === 'Space' || code === 'KeyE') { if (shop.tab === 0) shopBuy(); else shopSell(); }
    return;
  }
  if (CollectionSys.open) { if (code === 'Escape' || code === 'KeyC') CollectionSys.open = false; return; }
  if (dialog.active) {
    if (code === 'KeyE' || code === 'Space' || code === 'Enter') advanceDialog();
    else if (code === 'KeyG') {
      if (dialog.typewriterDone && isLastLine()) { invUI.open = true; invUI.mode = 'gift'; invUI.cursor = 0; }
    } else if (code === 'Escape') closeDialog();
    return;
  }
  if (invUI.open) {
    if (code === 'Escape' || code === 'KeyI') { if (invUI.mode === 'gift') invUI.mode = 'normal'; invUI.open = false; return; }
    if (code === 'ArrowLeft' || code === 'KeyA') invUI.cursor = Math.max(0, invUI.cursor - 1);
    else if (code === 'ArrowRight' || code === 'KeyD') invUI.cursor = Math.min(19, invUI.cursor + 1);
    else if (code === 'ArrowUp' || code === 'KeyW') invUI.cursor = Math.max(0, invUI.cursor - 5);
    else if (code === 'ArrowDown' || code === 'KeyS') invUI.cursor = Math.min(19, invUI.cursor + 5);
    else if (code === 'Enter' || code === 'Space' || code === 'KeyE') {
      if (invUI.mode === 'gift') { if (inventory.slots[invUI.cursor]) giveGift(invUI.cursor); else message.show('SLOT KOSONG', 1.2); }
      else { if (invUI.cursor < 5 && inventory.slots[invUI.cursor]) inventory.activeTool = invUI.cursor; }
    }
    return;
  }
  if (game.paused) {
    if (code === 'Escape') { game.paused = false; lastTime = performance.now(); accumulator = 0; }
    return;
  }
  if (game.state === 'title') {
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter' || code === 'KeyE') {
      AudioSys.playSfx('enter');
      game.state = 'play';
      game.paused = false;
      game.time = 0;
      if (game.hasSave) {
        const ok = SaveSys.load();
        if (ok) message.show('PERMAINAN DIMUAT', 2);
        else message.show('SIMPANAN RUSAK, MULAI BARU', 2);
      }
      snapCamera();
      SaveSys.save();
    } else if (code === 'KeyL' && game.hasSave) {
      AudioSys.playSfx('enter');
      game.state = 'play';
      game.paused = false;
      game.time = 0;
      SaveSys.load();
      snapCamera();
      message.show('PERMAINAN DIMUAT', 2);
    }
    return;
  }
  if (code === 'Escape') { game.paused = true; accumulator = 0; AudioSys.playSfx('menu'); }
  else if (code === 'KeyE' || code === 'Space') interact();
  else if (code === 'KeyQ') inventory.cycleTool();
  else if (code === 'Digit1' || code === 'Digit2' || code === 'Digit3' || code === 'Digit4' || code === 'Digit5') {
    const idx = parseInt(code.charAt(5), 10) - 1;
    if (inventory.slots[idx]) inventory.activeTool = idx;
  }
  else if (code === 'KeyI') { invUI.open = true; invUI.mode = 'normal'; invUI.cursor = 0; AudioSys.playSfx('menu'); }
  else if (code === 'KeyC') { CollectionSys.open = true; AudioSys.playSfx('menu'); }
  else if (code === 'KeyM') AudioSys.toggleMute();
  else if (code === 'KeyF') { if (SaveSys.save()) message.show('DIMUAT', 1.2); else message.show('GAGAL SIMPAN', 1.5); }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) SaveSys.save();
  lastTime = performance.now(); accumulator = 0;
});
window.addEventListener('resize', () => resize());
window.addEventListener('beforeunload', () => SaveSys.save());

/* ---------- 35. INIT ---------- */
function initInventory() {
  inventory.slots[0] = { id: 'net',    count: 1 };
  inventory.slots[1] = { id: 'rod',    count: 1 };
  inventory.slots[2] = { id: 'shovel', count: 1 };
  inventory.slots[3] = { id: 'axe',    count: 1 };
  inventory.slots[4] = { id: 'water',  count: 1 };
  inventory.slots[5] = { id: 'daun',   count: 3 };
  inventory.slots[6] = { id: 'bunga',  count: 2 };
  inventory.slots[7] = { id: 'apel',   count: 2 };
  inventory.slots[8] = { id: 'umpan',  count: 3 };
  inventory.activeTool = 0;
}
function init() {
  resize();
  Input.init();
  AudioSys.init();
  bakeAllAssets();
  generateWorld();
  worldGround = bakeWorldCanvas();
  generateInterior();
  for (let i = 0; i < NPC_DEFS.length; i++) npcs.push(createNPC(NPC_DEFS[i]));
  initInventory();
  buildCollectionList();
  Touch.init();
  player.x = 440; player.y = 372; player.dir = 'down';
  snapCamera();
  game.time = 0;
  game.hasSave = SaveSys.exists();
  lastTime = performance.now();
  accumulator = 0;
  rafId = requestAnimationFrame(frame);
}
init();
</script>
