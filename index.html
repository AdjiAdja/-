/* ---------- 2. MATH ---------- */
const V3={
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  scale:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{const l=V3.len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]}
};
const M4={
  perspective:(fov,aspect,near,far)=>{
    const f=1/Math.tan(fov/2),nf=1/(near-far);
    return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
  },
  lookAt:(eye,target,up)=>{
    const z=V3.norm(V3.sub(eye,target));
    const x=V3.norm(V3.cross(up,z));
    const y=V3.cross(z,x);
    return new Float32Array([
      x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
      -V3.dot(x,eye),-V3.dot(y,eye),-V3.dot(z,eye),1
    ]);
  }
};

/* ---------- 3. UTILITAS ---------- */
function hash2(x,y,s){
  let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041);
  h=Math.imul(h^(h>>>13),1274126177); h=h^(h>>>16);
  return (h>>>0)/4294967296;
}
function mulberry32(a){
  return function(){
    a|=0;a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}

function compileShader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s),src);
    throw new Error('shader');
  }
  return s;
}
function createProgram(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compileShader(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compileShader(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(p));
    throw new Error('program');
  }
  return p;
}

const voxelVS=`
attribute vec3 aPos;
attribute vec3 aNormal;
attribute vec3 aColor;
uniform mat4 uVP;
uniform vec3 uLight;
varying vec3 vColor;
void main(){
  gl_Position=uVP*vec4(aPos,1.0);
  float d=max(dot(normalize(aNormal),uLight),0.0);
  vColor=aColor*(0.55+d*0.55);
}`;
const voxelFS=`
precision mediump float;
varying vec3 vColor;
void main(){gl_FragColor=vec4(vColor,1.0);}`;
const voxelProg=createProgram(voxelVS,voxelFS);
const vLoc={
  aPos:gl.getAttribLocation(voxelProg,'aPos'),
  aNormal:gl.getAttribLocation(voxelProg,'aNormal'),
  aColor:gl.getAttribLocation(voxelProg,'aColor'),
  uVP:gl.getUniformLocation(voxelProg,'uVP'),
  uLight:gl.getUniformLocation(voxelProg,'uLight')
};

const bbVS=`
attribute vec2 aPos;
attribute vec2 aUV;
attribute vec4 aCS;
attribute vec4 aTint;
uniform mat4 uVP;
uniform vec3 uCamR;
uniform vec3 uCamU;
varying vec2 vUV;
varying vec4 vTint;
void main(){
  vec3 wp=aCS.xyz+uCamR*aPos.x*aCS.w+uCamU*aPos.y*aCS.w;
  gl_Position=uVP*vec4(wp,1.0);
  vUV=aUV;
  vTint=aTint;
}`;
const bbFS=`
precision mediump float;
uniform sampler2D uTex;
varying vec2 vUV;
varying vec4 vTint;
void main(){
  vec4 c=texture2D(uTex,vUV);
  if(c.a<0.1)discard;
  gl_FragColor=vec4(c.rgb*vTint.rgb,c.a*vTint.a);
}`;
const bbProg=createProgram(bbVS,bbFS);

};
const GKEYS=Object.keys(GLYPHS);
const GIDX={};
GKEYS.forEach((k,i)=>GIDX[k]=i);
const fontCache={};
function getFont(color){
  if(fontCache[color])return fontCache[color];
  const rows=Math.ceil(GKEYS.length/FCOLS);
  const cv=document.createElement('canvas');
  cv.width=FCOLS*FCW;cv.height=rows*FCH;
  const g=cv.getContext('2d');
  g.fillStyle=color;
  for(let i=0;i<GKEYS.length;i++){
    const bits=GLYPHS[GKEYS[i]];
    const ox=(i%FCOLS)*FCW,oy=Math.floor(i/FCOLS)*FCH;
    for(let r=0;r<FH;r++)for(let b=0;b<FW;b++){
      if(bits[r]&(1<<(FW-1-b)))g.fillRect(ox+b,oy+r,1,1);
    }
  }
  fontCache[color]=cv;
  return cv;
}
function tw(s){return s.length*FCW-1}
function drawText(str,x,y,rgb){
  const color='rgb('+Math.round(rgb[0]*255)+','+Math.round(rgb[1]*255)+','+Math.round(rgb[2]*255)+')';
  const atlas=getFont(color);
  str=String(str).toUpperCase();
  let cx=Math.round(x);
  const cy=Math.round(y);
  for(let i=0;i<str.length;i++){
    const ch=str[i],idx=GIDX[ch];
    if(idx!==undefined&&ch!==' '){
      const sx=(idx%FCOLS)*FCW,sy=Math.floor(idx/FCOLS)*FCH;
      uctx.drawImage(atlas,sx,sy,FCW,FCH,cx,cy,FCW,FCH);
    }
    cx+=FCW;
  }
}
function drawTextC(str,cx,y,rgb){drawText(str,Math.round(cx-tw(str)/2),y,rgb)}
function panel(x,y,w,h){

  uctx.fillRect(x,y,1,h);uctx.fillRect(x+w-1,y,1,h);
  uctx.fillStyle='rgb(255,207,107)';

}

const inv={slots:new Array(20).fill(null),active:0,
  add(id,n){
    n=n||1;const item=ITEMS[id];if(!item)return false;
    const max=item.isTool?1:99;
    for(let i=0;i<this.slots.length;i++){
      const s=this.slots[i];
      if(s&&s.id===id&&s.n<max){
        const a=Math.min(n,max-s.n);s.n+=a;n-=a;
        if(n<=0)return true;
      }
    }
    for(let i=0;i<this.slots.length;i++){
      if(!this.slots[i]){
        const a=Math.min(n,max);
        this.slots[i]={id,n:a};n-=a;
        if(n<=0)return true;
      }
    }
    return false;
  },
  removeAt(i,n){
    n=n||1;const s=this.slots[i];if(!s)return false;
    s.n-=n;if(s.n<=0)this.slots[i]=null;return true;
  },

/* ---------- 11. BAKING SPRITE ATLAS (untuk billboard WebGL) ---------- */
const ATLAS_W=16*4, ATLAS_H=16*16; // 4 kolom (frame) x N baris (16 per karakter untuk 4 dir? no — 4 frame per dir, 4 dir = 16 sprites)
const spriteUV={};
let atlasCanvas=null;
function bakeSpriteAtlas(){
  atlasCanvas=document.createElement('canvas');
  atlasCanvas.width=16*8; // 8 kolom untuk muat 4 frame x 4 dir... hmm
  atlasCanvas.height=16*8;
  const g=atlasCanvas.getContext('2d');
  g.imageSmoothingEnabled=false;
  let row=0;
  function drawSprite(rows,pal,x,y){
    for(let r=0;r<rows.length&&r<16;r++){
      const line=rows[r];
      for(let c=0;c<line.length&&c<16;c++){
        const ch=line[c];
        if(ch==='.'||ch==='0')continue;
        const col=pal[ch];
        if(!col)continue;
        g.fillStyle='rgb('+Math.round(col[0]*255)+','+Math.round(col[1]*255)+','+Math.round(col[2]*255)+')';
        g.fillRect(x+c,y+r,1,1);
      }
    }
    // legs
    g.fillStyle='rgb(74,111,165)';g.fillRect(x+4,y+13,8,1);g.fillRect(x+4,y+14,8,1);
    g.fillStyle='rgb(58,42,34)';g.fillRect(x+3,y+15,4,1);g.fillRect(x+9,y+15,4,1);
  }
  // Player: 4 dirs x 4 frames
  for(let d=0;d<4;d++){
    const rows=d===0?PLAYER_DOWN:(d===1?PLAYER_UP:PLAYER_SIDE);
    for(let f=0;f<4;f++){
      drawSprite(rows,PAL_PLAYER,f*16,d*16);
    }
  }
  // NPCs
  for(let ni=0;ni<NPC_DEFS.length;ni++){
    const def=NPC_DEFS[ni];
    const pal={...def.pal};
    for(let d=0;d<4;d++){
      for(let f=0;f<4;f++){
        const y=(4+ni*4+d)*16;
        drawSprite(def.body,pal,f*16,y);
      }
    }
  }
}
function makeTexture(canvas){
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,canvas);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return tex;
}

function addQuad(arr,arrC,arrN,x1,y1,z1,x2,y2,z2,x3,y3,z3,x4,y4,z4,nx,ny,nz,col){
  arr.push(x1,y1,z1,x2,y2,z2,x3,y3,z3, x1,y1,z1,x3,y3,z3,x4,y4,z4);
  arrN.push(nx,ny,nz,nx,ny,nz,nx,ny,nz, nx,ny,nz,nx,ny,nz,nx,ny,nz);
  for(let i=0;i<6;i++)arrC.push(col[0],col[1],col[2]);
}
function addBox(arr,arrC,arrN,cx,cy,cz,sx,sy,sz,col){
  const hx=sx/2,hy=sy/2,hz=sz/2;
  const x0=cx-hx,x1=cx+hx,y0=cy-hy,y1=cy+hy,z0=cz-hz,z1=cz+hz;
  // top
  addQuad(arr,arrC,arrN,x0,y1,z0,x1,y1,z0,x1,y1,z1,x0,y1,z1,0,1,0,col);
  // bottom (skip for perf if below ground)
  // sides
  addQuad(arr,arrC,arrN,x0,y0,z1,x1,y0,z1,x1,y1,z1,x0,y1,z1,0,0,1,col); // +z
  addQuad(arr,arrC,arrN,x1,y0,z0,x0,y0,z0,x0,y1,z0,x1,y1,z0,0,0,-1,col); // -z
  addQuad(arr,arrC,arrN,x1,y0,z1,x1,y0,z0,x1,y1,z0,x1,y1,z1,1,0,0,col); // +x
  addQuad(arr,arrC,arrN,x0,y0,z0,x0,y0,z1,x0,y1,z1,x0,y1,z0,-1,0,0,col); // -x
}

/* ---------- 13. DUNIA: TILE MAP ---------- */
const ground=new Uint8Array(MAP_W*MAP_H);
const solid=new Uint8Array(MAP_W*MAP_H);
const occupied=new Uint8Array(MAP_W*MAP_H);
const waterV=new Uint8Array(MAP_W*MAP_H);
const T={GRASS:0,PATH:1,SAND:2,WATER:3};

function getTile(tx,ty){
  if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return -1;
  return ground[ty*MAP_W+tx];
}
function setTile(tx,ty,t){
  if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return;
  ground[ty*MAP_W+tx]=t;
}
function isSolid(tx,ty){
  if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return true;
  return !!solid[ty*MAP_W+tx];
}

let objects=[]; // {x,y,z,kind,tx,ty,hp,...}
let flowers=[]; // {x,y,color,phase}
let bugs=[];
let digSpots=[];

function genWorld(){
  const rng=mulberry32(20240607);
  for(let i=0;i<MAP_W*MAP_H;i++){ground[i]=T.GRASS;solid[i]=0;occupied[i]=0;waterV[i]=0}
  // paths
  for(let tx=3;tx<=60;tx++){setTile(tx,24,T.PATH);setTile(tx,25,T.PATH)}
  for(let ty=3;ty<=45;ty++){setTile(30,ty,T.PATH);setTile(31,ty,T.PATH)}
  for(let ty=21;ty<=27;ty++)for(let tx=27;tx<=34;tx++)setTile(tx,ty,T.PATH);
  // water
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    const dx=(tx-47)/10.5,dy=(ty-11)/6.5;
    const d=dx*dx+dy*dy;
    if(d<=1){setTile(tx,ty,T.WATER);waterV[ty*MAP_W+tx]=(hash2(tx,ty,13)*3)|0}
    else if(d<=1.45&&getTile(tx,ty)===T.GRASS)setTile(tx,ty,T.SAND);
  }
  // boundary + water solid
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    const i=ty*MAP_W+tx;
    if(ground[i]===T.WATER)solid[i]=1;
    if(tx===0||ty===0||tx===MAP_W-1||ty===MAP_H-1)solid[i]=1;
  }
  // house
  const hx=28,hy=20;
  objects.push({kind:'house',tx:hx,ty:hy,x:hx*TILE,y:0,z:hy*TILE,doorX:hx+0.5,doorY:hy+1});
  for(let ty=hy-2;ty<=hy;ty++)for(let tx=hx-2;tx<=hx+1;tx++){
    if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)continue;
    solid[ty*MAP_W+tx]=1;occupied[ty*MAP_W+tx]=1;
  }
  // shop sign
  objects.push({kind:'sign',tx:34,ty:22,x:34.5,y:0,z:22.5});
  // trees border
  for(let tx=0;tx<MAP_W;tx++)for(const ty of[0,1,MAP_H-2,MAP_H-1]){
    if(rng()<0.7&&!isSolid(tx,ty)){addTree(tx,ty,(rng()*3)|0)}
  }
  for(let ty=0;ty<MAP_H;ty++)for(const tx of[0,1,MAP_W-2,MAP_W-1]){
    if(rng()<0.7&&!isSolid(tx,ty)&&!occupied[ty*MAP_W+tx]){addTree(tx,ty,(rng()*3)|0)}
  }
  // random trees
  for(let n=0;n<80;n++){
    const tx=2+((rng()*(MAP_W-4))|0);
    const ty=2+((rng()*(MAP_H-4))|0);
    if(getTile(tx,ty)===T.GRASS&&!isSolid(tx,ty)&&!occupied[ty*MAP_W+tx]&&rng()<0.55){
      addTree(tx,ty,(rng()*3)|0);
    }
  }
  // rocks & bushes
  for(let n=0;n<50;n++){
    const tx=2+((rng()*(MAP_W-4))|0);
    const ty=2+((rng()*(MAP_H-4))|0);
    if(getTile(tx,ty)===T.GRASS&&!isSolid(tx,ty)&&!occupied[ty*MAP_W+tx]){
      if(rng()<0.6){addRock(tx,ty)}else{addBush(tx,ty)}
    }
  }
  // flowers
  for(let ty=2;ty<MAP_H-2;ty++)for(let tx=2;tx<MAP_W-2;tx++){
    if(getTile(tx,ty)!==T.GRASS)continue;
    if(rng()<0.05){
      const c=[0.95,0.6,0.75];
      const alt=[[0.95,0.6,0.75],[0.97,0.85,0.45],[0.78,0.66,0.94],[0.97,0.63,0.54],[1,1,1]];
      flowers.push({tx,ty,x:tx+0.5,z:ty+0.5,color:alt[(rng()*5)|0],phase:rng()*6});
      occupied[ty*MAP_W+tx]=1;
    }
  }
  // clear spawn
  for(let ty=21;ty<=25;ty++)for(let tx=26;tx<=31;tx++){
    if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)continue;
    solid[ty*MAP_W+tx]=0;
  }
  objects=objects.filter(o=>{
    if(o.kind==='house'||o.kind==='sign')return true;
    if(o.tx>=26&&o.tx<=31&&o.ty>=21&&o.ty<=25)return false;
    return true;
  });
}
function addTree(tx,ty,v){
  if(isSolid(tx,ty)||occupied[ty*MAP_W+tx])return;
  solid[ty*MAP_W+tx]=1;occupied[ty*MAP_W+tx]=1;
  objects.push({kind:'tree',tx,ty,x:tx+0.5,y:0,z:ty+0.5,hp:3,v});
}
function addRock(tx,ty){
  if(isSolid(tx,ty)||occupied[ty*MAP_W+tx])return;
  solid[ty*MAP_W+tx]=1;occupied[ty*MAP_W+tx]=1;
  objects.push({kind:'rock',tx,ty,x:tx+0.5,y:0,z:ty+0.5});
}
function addBush(tx,ty){
  if(isSolid(tx,ty)||occupied[ty*MAP_W+tx])return;
  solid[ty*MAP_W+tx]=1;occupied[ty*MAP_W+tx]=1;
  objects.push({kind:'bush',tx,ty,x:tx+0.5,y:0,z:ty+0.5});
}

/* ---------- 14. CHUNK MESH BUILDING ---------- */
const CHUNK=16;
const chunks=[];
const NUM_CHUNKS_X=Math.ceil(MAP_W/CHUNK);
const NUM_CHUNKS_Y=Math.ceil(MAP_H/CHUNK);
function tileHeight(t){
  if(t===T.WATER)return 0.05;
  if(t===T.SAND)return 0.12;
  if(t===T.PATH)return 0.18;
  return 0.15;
}
function tileColor(tx,ty,t){
  const n=hash2(tx,ty,7);
  if(t===T.WATER){
    return waterV[ty*MAP_W+tx]%2?COL.waterA:COL.waterB;
  }
  if(t===T.PATH){
    return n>0.5?COL.pathA:COL.pathB;
  }
  if(t===T.SAND){
    return n>0.5?COL.sandA:COL.sandB;
  }
  if(n>0.85)return COL.grassC;
  if(n<0.15)return COL.grassB;
  return COL.grassA;
}
function buildChunk(cx,cy){
  const verts=[],colors=[],norms=[];
  const x0=cx*CHUNK,y0=cy*CHUNK;
  const x1=Math.min(x0+CHUNK,MAP_W),y1=Math.min(y0+CHUNK,MAP_H);
  // ground top faces
  for(let ty=y0;ty<y1;ty++)for(let tx=x0;tx<x1;tx++){
    const t=ground[ty*MAP_W+tx];
    const h=tileHeight(t);
    const col=tileColor(tx,ty,t);
    const z=ty*TILE,zz=z+TILE;
    const x=tx*TILE,xx=x+TILE;
    addQuad(verts,colors,norms,x,h,z,xx,h,z,xx,h,zz,x,h,zz,0,1,0,col);
  }
  // ground side faces (boundary between tiles with different heights)
  for(let ty=y0;ty<y1;ty++)for(let tx=x0;tx<x1;tx++){
    const t=ground[ty*MAP_W+tx];
    const h=tileHeight(t);
    const col=[tileColor(tx,ty,t)[0]*0.8,tileColor(tx,ty,t)[1]*0.8,tileColor(tx,ty,t)[2]*0.8];
    // check neighbors
    const nx=getTile(tx+1,ty);
    const nz=getTile(tx,ty+1);
    const px=getTile(tx-1,ty);
    const pz=getTile(tx,ty-1);
    const nh=0.15;
    if(nx>=0&&tileHeight(nx)<h-0.001){
      const x=tx*TILE+TILE,z=ty*TILE,zz=z+TILE;
      addQuad(verts,colors,norms,x,h,z,x,tileHeight(nx),z,x,tileHeight(nx),zz,x,h,zz,1,0,0,col);
    }
    if(nz>=0&&tileHeight(nz)<h-0.001){
      const z=ty*TILE+TILE,x=tx*TILE,xx=x+TILE;
      addQuad(verts,colors,norms,x,h,z,xx,h,z,xx,tileHeight(nz),z,x,tileHeight(nz),z,0,0,1,col);
    }
    if(px>=0&&tileHeight(px)<h-0.001){
      const x=tx*TILE,z=ty*TILE,zz=z+TILE;
      addQuad(verts,colors,norms,x,h,z,x,tileHeight(px),z,x,tileHeight(px),zz,x,h,zz,-1,0,0,col);
    }
    if(pz>=0&&tileHeight(pz)<h-0.001){
      const z=ty*TILE,x=tx*TILE,xx=x+TILE;
      addQuad(verts,colors,norms,x,h,z,xx,h,z,xx,tileHeight(pz),z,x,tileHeight(pz),z,0,0,-1,col);
    }
  }
  // objects in chunk (they stick up from ground)
  for(let i=0;i<objects.length;i++){
    const o=objects[i];
    if(o.tx<x0||o.tx>=x1||o.ty<y0||o.ty>=y1)continue;
    const bx=o.tx*TILE+TILE/2,bz=o.ty*TILE+TILE/2;
    const gy=tileHeight(ground[o.ty*MAP_W+o.tx]);
    if(o.kind==='tree')buildTree(verts,colors,norms,bx,gy,bz,o.v||0);
    else if(o.kind==='rock')buildRock(verts,colors,norms,bx,gy,bz);
    else if(o.kind==='bush')buildBush(verts,colors,norms,bx,gy,bz);
    else if(o.kind==='house')buildHouse(verts,colors,norms,o.tx*TILE,(o.ty-2)*TILE);
    else if(o.kind==='sign')buildSign(verts,colors,norms,bx,gy,bz);
  }
  // flowers as tiny meshes
  for(let i=0;i<flowers.length;i++){
    const f=flowers[i];
    if(f.tx<x0||f.tx>=x1||f.ty<y0||f.ty>=y1)continue;
    const gy=tileHeight(ground[f.ty*MAP_W+f.tx]);
    addBox(verts,colors,norms,f.x,gy+0.15,f.z,0.15,0.15,0.15,f.color);
  }
  return {verts,colors,norms,x0,y0,x1,y1};
}
function buildTree(v,cols,norms,x,gy,z){
  // trunk
  addBox(v,cols,norms,x,gy+0.9,z,0.35,1.8,0.35,COL.trunk);
  // foliage (cluster of boxes)
  const baseY=gy+2.0;
  addBox(v,cols,norms,x,baseY+0.3,z,1.4,0.9,1.4,COL.leafA);
  addBox(v,cols,norms,x,baseY+1.1,z,1.2,0.8,1.2,COL.leafB);
  addBox(v,cols,norms,x,baseY+1.9,z,0.9,0.8,0.9,COL.leafC);
  addBox(v,cols,norms,x,baseY+2.5,z,0.5,0.5,0.5,COL.leafC);
  // fruit dots
  if(v===1){
    addBox(v,cols,norms,x+0.4,baseY+0.9,z-0.2,0.2,0.2,0.2,[0.95,0.63,0.63]);
    addBox(v,cols,norms,x-0.3,baseY+1.5,z+0.2,0.2,0.2,0.2,[0.95,0.63,0.63]);
  }
}
function buildRock(v,cols,norms,x,gy,z){
  addBox(v,cols,norms,x,gy+0.35,z,0.85,0.7,0.85,COL.rock);
  addBox(v,cols,norms,x+0.15,gy+0.8,z+0.1,0.55,0.35,0.55,COL.rockD);
}
function buildBush(v,cols,norms,x,gy,z){
  addBox(v,cols,norms,x,gy+0.35,z,0.75,0.7,0.75,COL.leafA);
  addBox(v,cols,norms,x,gy+0.7,z,0.55,0.35,0.55,COL.leafB);
}
function buildHouse(v,cols,norms,x,z){
  const w=4,h=3,d=4;
  // walls
  addBox(v,cols,norms,x+w/2,0.15+h/2,z+d/2,w,h,d,COL.wall);
  // wall bottom (wood)
  addBox(v,cols,norms,x+w/2,0.4,z+d/2,w*1.02,0.5,d*1.02,COL.wallD);
  // door
  addBox(v,cols,norms,x+w/2,0.5+0.9,z+d,0.9,1.8,0.1,COL.door);
  // windows
  addBox(v,cols,norms,x+0.9,2.0,z+d,0.8,0.8,0.1,COL.glass);
  addBox(v,cols,norms,x+w-0.9,2.0,z+d,0.8,0.8,0.1,COL.glass);
  // roof (pyramid-ish)
  addBox(v,cols,norms,x+w/2,0.15+h+0.4,z+d/2,w+0.6,0.8,d+0.6,COL.roof);
  addBox(v,cols,norms,x+w/2,0.15+h+1.0,z+d/2,w-0.2,0.6,d-0.2,COL.roofD);
  addBox(v,cols,norms,x+w/2,0.15+h+1.4,z+d/2,w-1.4,0.4,d-1.4,COL.roof);
}
function buildSign(v,cols,norms,x,gy,z){
  addBox(v,cols,norms,x,gy+1.2,z,0.15,2.4,0.15,COL.woodD);
  addBox(v,cols,norms,x,gy+2.0,z,1.2,0.7,0.15,COL.wood);
  addBox(v,cols,norms,x,gy+1.9,z-0.1,0.8,0.15,0.05,[1.0,0.81,0.42]);
}
function buildAllChunks(){
  chunks.length=0;
  for(let cy=0;cy<NUM_CHUNKS_Y;cy++)for(let cx=0;cx<NUM_CHUNKS_X;cx++){
    const data=buildChunk(cx,cy);
    if(data.verts.length===0){chunks.push(null);continue}
    const posBuf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.verts),gl.STATIC_DRAW);
    const colBuf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,colBuf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.colors),gl.STATIC_DRAW);
    const nrmBuf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,nrmBuf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.norms),gl.STATIC_DRAW);
    chunks.push({posBuf,colBuf,nrmBuf,count:data.verts.length/3,meta:data});
  }
}

/* ---------- 15. BILLBOARD BUFFER ---------- */
let bbPosBuf=null,bbUVBuf=null,bbCSBuf=null,bbTintBuf=null;
let bbCount=0;
const bbVerts=[],bbUVs=[],bbCSs=[],bbTints=[];
function resetBillboards(){
  bbVerts.length=0;bbUVs.length=0;bbCSs.length=0;bbTints.length=0;
  bbCount=0;
}
function addBillboard(cx,cy,cz,size,u0,v0,u1,v1,tint){
  // two triangles
  const corners=[[-0.5,-0.5,u0,v0],[0.5,-0.5,u1,v0],[0.5,0.5,u1,v1],[-0.5,0.5,u0,v1]];
  const idx=[0,1,2,0,2,3];
  for(let i=0;i<6;i++){
    const c=corners[idx[i]];
    bbVerts.push(c[0],c[1]);
    bbUVs.push(c[2],c[3]);
    bbCSs.push(cx,cy,cz,size);
    bbTints.push(tint[0],tint[1],tint[2],tint[3]);
  }
  bbCount++;
}
function uploadBillboards(){
  if(!bbPosBuf){
    bbPosBuf=gl.createBuffer();bbUVBuf=gl.createBuffer();
    bbCSBuf=gl.createBuffer();bbTintBuf=gl.createBuffer();
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,bbPosBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(bbVerts),gl.DYNAMIC_DRAW);

/* ---------- 16. COLLISION ---------- */
const PLAYER_HW=0.35,PLAYER_HH=0.4;
function collides(px,pz,hw,hh){
  const bx=px-hw,bz=px-hh;
  const bx2=px+hw,bz2=pz+hh;
  const tx0=Math.floor(bx),tx1=Math.floor(bx2);
  const ty0=Math.floor(bz),ty1=Math.floor(bz2);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    if(isSolid(tx,ty))return true;
  }
  return false;
}
function tryMove(ent,dx,dz,hw,hh){
  if(dx!==0&&!collides(ent.x+dx,ent.z,hw,hh))ent.x+=dx;
  if(dz!==0&&!collides(ent.x,ent.z+dz,hw,hh))ent.z+=dz;
}

/* ---------- 17. NPC ---------- */
function makeNPC(def){
  const baseRow=4+NPC_DEFS.indexOf(def)*4;
  return {
    def,name:def.name,personality:def.personality,
    x:def.spawnX,z:def.spawnY,
    homeX:def.spawnX,homeZ:def.spawnY,
    dir:'down',frame:0,animT:0,
    state:'idle',timer:1+Math.random()*2,
    affinity:0,baseRow,
    getGreet(){
      const t=this.affinity>=3?'f':(this.affinity>=1?'a':'s');
      const pool=this.def.greet[t];
      return pool[(Math.random()*pool.length)|0];
    }
  };
}
function updateNPCs(dt){
  for(const npc of npcs){
    if(dialog.active&&dialog.npc===npc)continue;
    npc.timer-=dt;
    if(npc.state==='idle'){
      if(npc.timer<=0){
        const r=Math.random();
        if(r<0.6){
          npc.state='walk';npc.timer=1.5+Math.random()*2.5;
          npc.dir=['down','up','left','right'][(Math.random()*4)|0];
        }else{npc.timer=1.5+Math.random()*2.5}
      }
      npc.frame=0;
    }else{
      const dx=npc.x-npc.homeX,dz=npc.z-npc.homeZ;
      const dh=Math.sqrt(dx*dx+dz*dz);
      let mx=0,mz=0;
      if(dh>4){mx=-Math.sign(dx);mz=-Math.sign(dz)}
      else{
        if(npc.dir==='down')mz=1;
        else if(npc.dir==='up')mz=-1;
        else if(npc.dir==='left')mx=-1;
        else mx=1;
      }
      const l=Math.sqrt(mx*mx+mz*mz)||1;
      const sp=NPC_SPEED*dt;
      const ox=npc.x,oz=npc.z;
      tryMove(npc,mx/l*sp,mz/l*sp,0.35,0.4);
      if(Math.abs(npc.x-ox)<0.001&&Math.abs(npc.z-oz)<0.001)npc.timer=0;
      npc.animT+=dt;
      npc.frame=Math.floor(npc.animT*6)%4;
      if(npc.timer<=0){npc.state='idle';npc.timer=1+Math.random()*3;npc.frame=0}
    }
  }
}

const dialog={active:false,npc:null,lines:[],idx:0,full:'',text:'',t:0,done:false};
function startDialog(npc){
  dialog.active=true;dialog.npc=npc;
  dialog.lines=[npc.getGreet()];dialog.idx=0;
  dialog.full=dialog.lines[0];dialog.text='';dialog.t=0;dialog.done=false;
  face(npc,player.x,player.z);
  face(player,npc.x,npc.z);
  Audio.sfx('dialog');
}
function face(ent,tx,tz){
  const dx=tx-ent.x,dz=tz-ent.z;
  if(Math.abs(dx)>Math.abs(dz))ent.dir=dx>0?'right':'left';
  else ent.dir=dz>0?'down':'up';
}
function advanceDialog(){
  if(!dialog.active)return;
  if(!dialog.done){dialog.text=dialog.full;dialog.done=true;return}
  dialog.idx++;
  if(dialog.idx>=dialog.lines.length){closeDialog();return}
  dialog.full=dialog.lines[dialog.idx];dialog.text='';dialog.t=0;dialog.done=false;
  Audio.sfx('dialog');
}
function closeDialog(){dialog.active=false;dialog.npc=null;dialog.lines=[]}
function updateDialog(dt){
  if(!dialog.active||dialog.done)return;
  dialog.t+=dt;
  const n=Math.floor(dialog.t*45);
  if(n>=dialog.full.length){dialog.text=dialog.full;dialog.done=true}
  else dialog.text=dialog.full.substring(0,n);
}
function npcReact(npc,itemId){
  const item=ITEMS[itemId];
  if(!item)return'HMM?';
  const s=(item.gift||1)+npc.affinity;
  if(npc.personality==='cheerful')return s>=5?'WAAAH! MAKASIH YA~':(s>=3?'TERIMA KASIH! AKU SUKA.':'HEHE MAKASIH!');
  if(npc.personality==='gruff')return s>=5?'HMM... BAGUS. MAKASIH.':(s>=3?'OH... MAKASIH.':'MAKASIH YA.');
  if(npc.personality==='sleepy')return s>=5?'NYAA~ MAKASIH...':(s>=3?'NYA... MAKASIH...':'NYA~');
  return s>=5?'ADUH MANIS! MAKASIH SAYANG~':(s>=3?'IH MAKASIH!':'MAKASIH SAYANG.');
}
function giveGift(idx){

const FISH_TABLE=[
  {id:'ikan_kecil',w:45,h0:0,h1:24},
  {id:'ikan_sedang',w:30,h0:6,h1:22},
  {id:'ikan_besar',w:10,h0:10,h1:18},
  {id:'udang',w:15,h0:18,h1:6}
];
function pickFish(){
  const h=TimeSys.hour;
  let tot=0;const avail=[];
  for(const f of FISH_TABLE){
    const ok=f.h0<f.h1?(h>=f.h0&&h<f.h1):(h>=f.h0||h<f.h1);
    if(ok){avail.push(f);tot+=f.w}
  }
  if(!avail.length)return'ikan_kecil';
  let r=Math.random()*tot;
  for(const f of avail){r-=f.w;if(r<=0)return f.id}
  return avail[avail.length-1].id;
}
function findFishSpot(){
  let tx=Math.floor(player.x),tz=Math.floor(player.z);
  let dx=0,dz=0;
  if(player.dir==='down')dz=1;else if(player.dir==='up')dz=-1;
  else if(player.dir==='left')dx=-1;else dx=1;
  for(let r=1;r<=2;r++){
    if(getTile(tx+dx*r,tz+dz*r)===T.WATER){
      return{x:(tx+dx*r)*TILE+0.5,z:(tz+dz*r)*TILE+0.5}
    }
  }
  return null;
}
const fishing={state:'idle',timer:0,cx:0,cz:0,cursor:0,dir:1,speed:220,result:'',umpan:false};
function startFishing(){
  const spot=findFishSpot();
  if(!spot){message.show('HADAP AIR UNTUK MEMANCING',1.5);Audio.sfx('error');return}
  fishing.state='casting';fishing.timer=0.4;fishing.cx=spot.x;fishing.cz=spot.z;fishing.umpan=false;
  for(let i=0;i<inv.slots.length;i++){
    if(inv.slots[i]&&inv.slots[i].id==='umpan'){inv.removeAt(i,1);fishing.umpan=true;break}
  }
  Audio.sfx('cast');
}
function updateFishing(dt){
  if(fishing.state==='idle')return;
  fishing.timer-=dt;
  if(fishing.state==='casting'){
    if(fishing.timer<=0){fishing.state='waiting';fishing.timer=fishing.umpan?0.6+Math.random()*1.2:1.5+Math.random()*2.5}
  }else if(fishing.state==='waiting'){
    if(fishing.timer<=0){fishing.state='bite';fishing.timer=1.2;Audio.sfx('bite')}
  }else if(fishing.state==='bite'){
    if(fishing.timer<=0){fishing.state='idle';message.show('IKAN KABUR...',1.5)}
  }else if(fishing.state==='minigame'){
    fishing.cursor+=fishing.dir*fishing.speed*dt;
    if(fishing.cursor>100){fishing.cursor=100;fishing.dir=-1}
    if(fishing.cursor<0){fishing.cursor=0;fishing.dir=1}
  }else if(fishing.state==='result'){
    if(fishing.timer<=0)fishing.state='idle';
  }
}
function fishingPress(){
  if(fishing.state==='bite'){
    fishing.state='minigame';fishing.cursor=0;fishing.dir=1;fishing.speed=200+Math.random()*80;
  }else if(fishing.state==='minigame'){
    const ok=fishing.cursor>=35&&fishing.cursor<=65;
    if(ok){

      inv.add(id,1);
      fishing.result='DAPAT '+ITEMS[id].name+'!';

      Audio.sfx('catch');

}

/* ---------- 26. AUDIO ---------- */
const Audio={
  ctx:null,master:null,muted:false,ambTimer:0,ambIdx:0,
  init(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return false;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.35;
      this.master.connect(this.ctx.destination);
      return true;
    }catch(e){return false}
  },
  gesture(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})},
  toggle(){this.muted=!this.muted;if(this.master)this.master.gain.value=this.muted?0:0.35;message.show(this.muted?'SUARA MATI':'SUARA HIDUP',1.2)},
  sfx(name){
    if(!this.ctx||this.muted)return;
    const c=this.ctx,t=c.currentTime;
    const mk=(freq,type,dur,vol,slide)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type=type||'square';
      o.frequency.setValueAtTime(freq,t);
      if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t+dur);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol||0.1,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.connect(g);g.connect(this.master);
      o.start(t);o.stop(t+dur+0.02);
    };
    switch(name){
      case'dialog':mk(520,'square',0.06,0.06);break;
      case'gift':mk(660,'square',0.1,0.1);setTimeout(()=>mk(880,'square',0.15,0.1),90);break;
      case'catch':mk(700,'square',0.08,0.12);setTimeout(()=>mk(1000,'square',0.1,0.12),60);setTimeout(()=>mk(1320,'square',0.14,0.12),130);break;
      case'cast':mk(400,'triangle',0.12,0.08,0.5);break;
      case'bite':mk(900,'square',0.08,0.1);setTimeout(()=>mk(1200,'square',0.08,0.1),70);break;
      case'miss':mk(300,'sawtooth',0.2,0.08,0.5);break;
      case'dig':mk(220,'square',0.1,0.08,0.7);break;
      case'chop':mk(160,'square',0.1,0.1,0.5);break;
      case'treefall':mk(120,'sawtooth',0.4,0.12,0.4);break;
      case'plant':mk(500,'triangle',0.1,0.08);setTimeout(()=>mk(750,'triangle',0.1,0.08),80);break;
      case'buy':mk(880,'square',0.08,0.1);setTimeout(()=>mk(1100,'square',0.1,0.1),60);break;
      case'sell':mk(1100,'square',0.08,0.1);setTimeout(()=>mk(880,'square',0.1,0.1),60);break;
      case'error':mk(200,'sawtooth',0.15,0.08);break;
      case'menu':mk(660,'square',0.05,0.06);break;
      case'enter':mk(500,'triangle',0.15,0.1);setTimeout(()=>mk(750,'triangle',0.2,0.1),120);break;
    }
  },
  tick(dt){
    if(!this.ctx||this.muted)return;
    this.ambTimer-=dt;
    if(this.ambTimer<=0){
      this.ambTimer=3.6+Math.random()*1.2;
      const scale=[261.63,293.66,329.63,392.00,440.00,523.25];
      const note=scale[this.ambIdx%scale.length];this.ambIdx++;
      const c=this.ctx,t=c.currentTime;
      const o=c.createOscillator(),g=c.createGain();
      o.type='triangle';o.frequency.setValueAtTime(note,t);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.05,t+0.4);
      g.gain.exponentialRampToValueAtTime(0.001,t+2.0);
      o.connect(g);g.connect(this.master);
      o.start(t);o.stop(t+2.1);
    }
  }
};

const Touch={
  active:false,axisX:0,axisZ:0,joyId:null,joyStartX:0,joyStartY:0,joyCX:0,joyCY:0,
  camId:null,camLastX:0,camLastY:0,
  btnStates:{A:false,B:false,M:false,C:false},
  buttons:[],
  init(){
    const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
    if(!isTouch)return;
    this.active=true;
    // UI-pixel positions (buttons)
    this.buttons=[
      {id:'A',x:UI_W-42,y:UI_H-42,r:16},
      {id:'B',x:UI_W-72,y:UI_H-30,r:13},
      {id:'C',x:UI_W-30,y:30,r:11},
      {id:'M',x:UI_W-58,y:30,r:11}
    ];
    // screen coords helper
    const toUI=(sx,sy)=>{
      const cw=window.innerWidth,ch=window.innerHeight;
      const scale=uiScale;
      return {x:(sx-uiOffX)/scale,y:(sy-uiOffY)/scale};
    };
    const hit=(ux,uy)=>{
      for(const b of this.buttons){
        const d=Math.hypot(ux-b.x,uy-b.y);
        if(d<b.r+4)return b;
      }
      return null;
    };
    const joyRegion={x:0,y:UI_H-65,w:65,h:65};
    const inJoy=(ux,uy)=>ux>=joyRegion.x&&ux<=joyRegion.x+joyRegion.w&&uy>=joyRegion.y&&uy<=joyRegion.y+joyRegion.h;
    window.addEventListener('touchstart',(e)=>{
      Audio.gesture();
      for(const t of e.changedTouches){
        const p=toUI(t.clientX,t.clientY);
        const btn=hit(p.x,p.y);
        if(btn){
          this.pressButton(btn.id);
        }else if(inJoy(p.x,p.y)){
          this.joyId=t.identifier;
          this.joyStartX=p.x;this.joyStartY=p.y;
          this.joyCX=joyRegion.x+joyRegion.w/2;
          this.joyCY=joyRegion.y+joyRegion.h/2;
          this.axisX=0;this.axisZ=0;
        }else if(this.camId===null){
          this.camId=t.identifier;
          this.camLastX=t.clientX;this.camLastY=t.clientY;
        }
      }
    },{passive:false});
    window.addEventListener('touchmove',(e)=>{
      for(const t of e.changedTouches){
        if(t.identifier===this.joyId){
          const p=toUI(t.clientX,t.clientY);
          const dx=p.x-this.joyStartX,dy=p.y-this.joyStartY;
          const r=28;
          const nx=dx/r,ny=dy/r;
          this.axisX=Math.max(-1,Math.min(1,nx));
          this.axisZ=Math.max(-1,Math.min(1,ny));
          this.joyCX=joyRegion.x+joyRegion.w/2+this.axisX*20;
          this.joyCY=joyRegion.y+joyRegion.h/2+this.axisZ*20;
        }else if(t.identifier===this.camId){
          const dx=t.clientX-this.camLastX;
          const dy=t.clientY-this.camLastY;
          this.camLastX=t.clientX;this.camLastY=t.clientY;
          camera.yaw-=dx*0.008;
          camera.pitch=Math.max(0.3,Math.min(1.4,camera.pitch+dy*0.005));
        }
      }
    },{passive:false});
    const endTouch=(e)=>{
      for(const t of e.changedTouches){
        if(t.identifier===this.joyId){
          this.joyId=null;this.axisX=0;this.axisZ=0;
        }else if(t.identifier===this.camId){
          this.camId=null;
        }
      }
      if(e.touches.length===0){
        this.btnStates.A=this.btnStates.B=this.btnStates.C=this.btnStates.M=false;
      }
    };
    window.addEventListener('touchend',endTouch,{passive:false});
    window.addEventListener('touchcancel',endTouch,{passive:false});
  },
  pressButton(id){
    this.btnStates[id]=true;
    setTimeout(()=>{this.btnStates[id]=false},150);
    if(id==='A')onKey('KeyE');
    else if(id==='B')onKey('KeyI');
    else if(id==='C')onKey('KeyC');
    else if(id==='M')Audio.toggle();
  },
  render(){
    if(!this.active)return;
    // joystick base
    uctx.strokeStyle='rgba(243,227,200,0.5)';uctx.lineWidth=1;
    uctx.beginPath();uctx.arc(32,UI_H-32,22,0,Math.PI*2);uctx.stroke();
    uctx.fillStyle='rgba(26,20,18,0.55)';
    uctx.beginPath();uctx.arc(32,UI_H-32,22,0,Math.PI*2);uctx.fill();
    const kx=32+(this.joyId?this.axisX*14:0);
    const ky=UI_H-32+(this.joyId?this.axisZ*14:0);
    uctx.fillStyle='rgba(255,207,107,0.85)';
    uctx.beginPath();uctx.arc(kx,ky,7,0,Math.PI*2);uctx.fill();
    // buttons
    for(const b of this.buttons){
      const on=this.btnStates[b.id];
      uctx.fillStyle=on?'rgba(255,207,107,0.7)':'rgba(26,20,18,0.6)';
      uctx.beginPath();uctx.arc(b.x,b.y,b.r,0,Math.PI*2);uctx.fill();
      uctx.strokeStyle='rgba(243,227,200,0.7)';uctx.lineWidth=1;
      uctx.beginPath();uctx.arc(b.x,b.y,b.r,0,Math.PI*2);uctx.stroke();
      drawTextC(b.id,b.x,b.y-3,on?COL.uiBg:COL.uiGold);
    }
  }
};

const Save={
  save(){
    try{
      const data={
        v:SAVE_VERSION,
        player:{x:player.x,z:player.z,dir:player.dir,scene:player.scene},
        money:money.amount,
        inv:inv.slots.map(s=>s?{id:s.id,n:s.n}:null),

        affin:npcs.map(n=>n.affinity),
        caught:Collection.caught,
        weather:{type:Weather.type,timer:Weather.timer},
        tutorial:game.tutorial
      };
      localStorage.setItem(SAVE_KEY,JSON.stringify(data));
      return true;
    }catch(e){return false}
  },
  load(){
    try{
      const raw=localStorage.getItem(SAVE_KEY);
      if(!raw)return false;
      const d=JSON.parse(raw);
      if(!d||d.v!==SAVE_VERSION)return false;
      if(typeof d.player?.x!=='number')return false;
      if(!Array.isArray(d.inv)||d.inv.length!==20)return false;
      player.x=d.player.x;player.z=d.player.z;
      player.scene=d.player.scene==='interior'?'interior':'world';
      player.dir=['down','up','left','right'].includes(d.player.dir)?d.player.dir:'down';
      money.amount=typeof d.money==='number'?d.money:100;
      for(let i=0;i<20;i++){
        const s=d.inv[i];
        if(s&&typeof s.id==='string'&&ITEMS[s.id]&&typeof s.n==='number'&&s.n>0)
          inv.slots[i]={id:s.id,n:s.n};
        else inv.slots[i]=null;
      }
      inv.active=typeof d.active==='number'?Math.max(0,Math.min(4,d.active)):0;
      if(Array.isArray(d.affin)){
        for(let i=0;i<npcs.length&&i<d.affin.length;i++)
          npcs[i].affinity=typeof d.affin[i]==='number'?d.affin[i]:0;
      }
      if(d.caught&&typeof d.caught==='object')Collection.caught=d.caught;
      if(d.weather&&typeof d.weather.type==='string'){
        Weather.type=['sunny','rain','windy'].includes(d.weather.type)?d.weather.type:'sunny';
        Weather.timer=typeof d.weather.timer==='number'?d.weather.timer:120;
      }
      game.tutorial=!!d.tutorial;
      return true;
    }catch(e){return false}
  },
  exists(){try{return!!localStorage.getItem(SAVE_KEY)}catch(e){return false}}
};

/* ---------- 30. KAMERA ---------- */
function updateCamera(dt){
  if(player.scene==='interior'){
    // simple interior camera
    camPos.x=player.x;
    camPos.y=2.5;
    camPos.z=player.z+4;
    return;
  }
  const cy=Math.cos(camera.yaw),sy=Math.sin(camera.yaw);
  const cp=Math.cos(camera.pitch),sp=Math.sin(camera.pitch);
  const dist=camera.dist;
  const targetX=player.x,targetZ=player.z,targetY=0.6;
  camPos.x=targetX+sy*cp*dist;
  camPos.y=targetY+sp*dist;
  camPos.z=targetZ+cy*cp*dist;
}
function getViewProj(){
  const aspect=glCanvas.width/glCanvas.height;
  const proj=M4.perspective(Math.PI/3,aspect,0.1,80);
  const view=M4.lookAt([camPos.x,camPos.y,camPos.z],[player.x,0.6,player.z],[0,1,0]);
  // view*proj
  const vp=new Float32Array(16);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    let s=0;
    for(let k=0;k<4;k++)s+=proj[k*4+j]*view[i*4+k];
    vp[i*4+j]=s;
  }
  return vp;
}
function getCamRightUp(){
  const fx=player.x-camPos.x,fy=0.6-camPos.y,fz=player.z-camPos.z;
  const fl=Math.sqrt(fx*fx+fy*fy+fz*fz)||1;
  const fwd=[fx/fl,fy/fl,fz/fl];
  const r=V3.norm(V3.cross([0,1,0],fwd));
  const u=V3.cross(fwd,r);
  return{right:r,up:u};
}

/* ---------- 31. GAME LOGIC: UPDATE ---------- */
function updatePlayer(dt){
  if(fishing.state!=='idle'){player.moving=false;player.frame=0;return}
  let x=0,z=0;
  if(keys['KeyA']||keys['ArrowLeft'])x-=1;
  if(keys['KeyD']||keys['ArrowRight'])x+=1;
  if(keys['KeyW']||keys['ArrowUp'])z-=1;
  if(keys['KeyS']||keys['ArrowDown'])z+=1;
  // touch
  x+=Touch.axisX;z+=Touch.axisZ;
  const len=Math.sqrt(x*x+z*z);
  if(len<0.15){player.moving=false;player.animT=0;player.frame=0;return}
  player.moving=true;
  if(len>1){x/=len;z/=len}
  // camera-relative movement: forward = camera direction projected to ground
  const cy=Math.cos(camera.yaw),sy=Math.sin(camera.yaw);
  // camera looks toward player from (sy*dist, ..., cy*dist)
  // forward = -direction from cam to player in xz = (-sy*cp, -cy*cp) normalized
  // for simplicity: forward = (-sy, -cy)
  const fx=-sy,fz=-cy;
  const rx=cy,rz=-sy;
  const wx=x*rx+z*fx;
  const wz=x*rz+z*fz;
  const wl=Math.sqrt(wx*wx+wz*wz)||1;
  const sp=SPEED*dt;
  tryMove(player,wx/wl*sp,wz/wl*sp,PLAYER_HW,PLAYER_HH);
  // facing
  if(Math.abs(wx)>Math.abs(wz))player.dir=wx>0?'right':'left';
  else player.dir=wz>0?'down':'up';
  player.animT+=dt;
  player.frame=Math.floor(player.animT*8)%4;
}
function findNearestNPC(){
  let n=null,bd=INTERACT_R;
  for(const npc of npcs){
    const d=Math.hypot(npc.x-player.x,npc.z-player.z);
    if(d<bd){bd=d;n=npc}
  }
  return n;
}
function nearShop(){return Math.hypot(34.5-player.x,22.5-player.z)<1.8}
function nearHouse(){
  for(const o of objects){
    if(o.kind!=='house')continue;
    if(Math.hypot(o.doorX-player.x,o.doorY-player.z)<1.8)return o;
  }
  return null;
}
function interact(){
  if(player.scene==='interior'){
    message.show('TEKAN ESC UNTUK KELUAR',1.2);return;
  }
  const npc=findNearestNPC();
  if(npc){startDialog(npc);return}
  if(nearShop()){shop.open=true;shop.tab=0;shop.cursor=0;Audio.sfx('menu');return}
  if(nearHouse()){message.show('RUMAH - FITUR SEGERA',1.5);return}
  const slot=inv.active_item();
  if(!slot){message.show('TANGAN KOSONG',1.0);return}
  const id=slot.id;
  if(id==='rod'){startFishing();return}
  if(id==='net'){tryCatchBug();return}
  if(id==='shovel'){tryDig();return}
  if(id==='axe'){tryChop();return}
  if(id==='seed'){tryPlant();return}
  if(id==='water'){message.show('PENYIRAM DIPAKAI',1.0);return}
  message.show(ITEMS[id].name.toUpperCase()+' DIPAKAI',1.0);
}
function rebuildChunk(cx,cy){
  const idx=cy*NUM_CHUNKS_X+cx;
  const old=chunks[idx];
  if(old){
    gl.deleteBuffer(old.posBuf);gl.deleteBuffer(old.colBuf);gl.deleteBuffer(old.nrmBuf);
  }
  const data=buildChunk(cx,cy);
  if(data.verts.length===0){chunks[idx]=null;return}
  const posBuf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.verts),gl.STATIC_DRAW);
  const colBuf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,colBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.colors),gl.STATIC_DRAW);
  const nrmBuf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,nrmBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.norms),gl.STATIC_DRAW);
  chunks[idx]={posBuf,colBuf,nrmBuf,count:data.verts.length/3,meta:data};
}

    uctx.fillStyle=caught?'rgba(138,223,122,0.15)':'rgba(0,0,0,0.25)';
    uctx.fillRect(x,y,cw-6,16);
    if(caught&&ITEM_COLORS[id]){
      const c=ITEM_COLORS[id];
      uctx.fillStyle='rgb('+Math.round(c[0]*255)+','+Math.round(c[1]*255)+','+Math.round(c[2]*255)+')';
      uctx.fillRect(x+2,y+2,12,12);
    }
    drawText(caught?ITEMS[id].name:'???',x+18,y+5,caught?COL.uiText:COL.uiDim);
  }
  drawTextC('ESC: TUTUP',UI_W/2,py+ph-11,COL.uiGold);
}

/* ---------- 33. RENDER LOOP ---------- */
function renderScene(){
  const vp=getViewProj();
  const tint=TimeSys.lightTint();
  gl.clearColor(tint[0]*0.55,tint[1]*0.68,tint[2]*0.85,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);

  // Draw chunks
  gl.useProgram(voxelProg);
  gl.uniformMatrix4fv(vLoc.uVP,false,vp);
  gl.uniform3f(vLoc.uLight,0.5,0.9,0.4);
  for(const ch of chunks){
    if(!ch)continue;
    gl.bindBuffer(gl.ARRAY_BUFFER,ch.posBuf);
    gl.enableVertexAttribArray(vLoc.aPos);
    gl.vertexAttribPointer(vLoc.aPos,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,ch.nrmBuf);
    gl.enableVertexAttribArray(vLoc.aNormal);
    gl.vertexAttribPointer(vLoc.aNormal,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,ch.colBuf);
    gl.enableVertexAttribArray(vLoc.aColor);
    gl.vertexAttribPointer(vLoc.aColor,3,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.TRIANGLES,0,ch.count);
  }

  // Build billboards
  resetBillboards();
  // Player
  const pDirRow=player.dir==='down'?0:(player.dir==='up'?1:(player.dir==='left'?2:2));
  const pU0=player.frame/4,pU1=(player.frame+1)/4;
  const pV0=(pDirRow*16)/(8*16),pV1=((pDirRow+1)*16)/(8*16);
  addBillboard(player.x,1.2,player.z,1.7,pU0,pV0,pU1,pV1,[1,1,1,1]);
  // NPCs
  for(const npc of npcs){
    const dr=npc.dir==='down'?0:(npc.dir==='up'?1:(npc.dir==='left'?2:2));
    const row=npc.baseRow+dr;
    const u0=npc.frame/4,u1=(npc.frame+1)/4;
    const v0=(row*16)/(8*16),v1=((row+1)*16)/(8*16);
    addBillboard(npc.x,1.15,npc.z,1.6,u0,v0,u1,v1,[1,1,1,1]);
  }
  // Bugs (small billboards - colored)
  for(const b of bugs){
    addBillboard(b.x,0.35,b.z,0.7,0,0,1,1,[1,1,1,1]);
  }
  // Dig spots
  for(const d of digSpots){
    addBillboard(d.x,0.1,d.z,0.8,0,0,1,1,[0.6,0.4,0.2,1]);
  }

  uploadBillboards();

  // Draw billboards
  if(bbCount>0){
    gl.useProgram(bbProg);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.DEPTH_TEST);
    gl.uniformMatrix4fv(bLoc.uVP,false,vp);
    const ru=getCamRightUp();
    gl.uniform3fv(bLoc.uCamR,ru.right);
    gl.uniform3fv(bLoc.uCamU,ru.up);
    gl.uniform1i(bLoc.uTex,0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,spriteTex);
    gl.bindBuffer(gl.ARRAY_BUFFER,bbPosBuf);
    gl.enableVertexAttribArray(bLoc.aPos);
    gl.vertexAttribPointer(bLoc.aPos,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,bbUVBuf);
    gl.enableVertexAttribArray(bLoc.aUV);
    gl.vertexAttribPointer(bLoc.aUV,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,bbCSBuf);
    gl.enableVertexAttribArray(bLoc.aCS);
    gl.vertexAttribPointer(bLoc.aCS,4,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,bbTintBuf);
    gl.enableVertexAttribArray(bLoc.aTint);
    gl.vertexAttribPointer(bLoc.aTint,4,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.TRIANGLES,0,bbCount*6);
    gl.disable(gl.BLEND);
    gl.enable(gl.DEPTH_TEST);
  }
}

/* ---------- 34. UI RENDER ---------- */
function renderUI(){
  uctx.clearRect(0,0,UI_W,UI_H);
  if(game.state==='title'){
    renderTitle();
    if(Touch.active)Touch.render();
    return;
  }
  renderHUD();
  renderHotbar();
  renderMessage();
  renderFishingUI();
  if(invUI.open)renderInventory();
  else if(dialog.active)renderDialog();
  if(shop.open)renderShop();
  if(Collection.open)renderCollection();
  if(game.paused)renderPause();
  if(!game.tutorial)renderTutorial();
  if(Touch.active)Touch.render();
}

/* ---------- 35. LOOP ---------- */
let lastT=0,acc=0;
function update(dt){
  game.time+=dt;
  if(game.paused)return;
  TimeSys.update();
  Weather.update(dt);
  Audio.tick(dt);
  updateDialog(dt);
  updateFishing(dt);
  if(!game.tutorial)return;
  if(fishing.state==='idle'&&!dialog.active&&!invUI.open&&!shop.open&&!Collection.open){
    updatePlayer(dt);
    updateNPCs(dt);
  }
  updateBugs(dt);
  updateDig(dt);
  updateCamera(dt);
  if(message.timer>0)message.timer-=dt;
  autoSave(dt);
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastT)/1000;lastT=now;
  if(!isFinite(dt)||dt<0)dt=0;
  if(dt>0.25)dt=0.25;
  if(!game.paused){
    acc+=dt;
    let n=0;
    while(acc>=STEP&&n<5){update(STEP);acc-=STEP;n++}
    if(n>=5)acc=0;
  }else game.time+=dt;
  updateCamera(0);
  renderScene();
  renderUI();
}

/* ---------- 36. INPUT HANDLER ---------- */
function onKey(code){
  if(!game.tutorial&&game.state==='play'){
    if(code==='KeyE'||code==='Space'||code==='Enter'){
      game.tutorial=true;Audio.sfx('menu');Save.save();
    }
    return;
  }
  if(fishing.state==='bite'||fishing.state==='minigame'){
    if(code==='KeyE'||code==='Space'){fishingPress();return}
  }
  if(fishing.state!=='idle'){if(code==='Escape')fishing.state='idle';return}
  if(shop.open){
    if(code==='Escape'){shop.open=false;Audio.sfx('menu');return}
    if(code==='Tab'){shop.tab=(shop.tab+1)%2;shop.cursor=0;Audio.sfx('menu');return}
    if(code==='ArrowUp'||code==='KeyW')shop.cursor=Math.max(0,shop.cursor-1);
    else if(code==='ArrowDown'||code==='KeyS'){
      const mx=shop.tab===0?shop.buy.length-1:7;
      shop.cursor=Math.min(mx,shop.cursor+1);
    }
    else if(code==='Enter'||code==='Space'||code==='KeyE'){
      if(shop.tab===0)shopBuy();else shopSell();
    }
    return;
  }
  if(Collection.open){if(code==='Escape'||code==='KeyC')Collection.open=false;return}
  if(dialog.active){
    if(code==='KeyE'||code==='Space'||code==='Enter')advanceDialog();
    else if(code==='KeyG'){
      if(dialog.done&&dialog.idx>=dialog.lines.length-1){
        invUI.open=true;invUI.mode='gift';invUI.cursor=0;
      }
    }else if(code==='Escape')closeDialog();
    return;
  }
  if(invUI.open){
    if(code==='Escape'||code==='KeyI'){if(invUI.mode==='gift')invUI.mode='normal';invUI.open=false;return}
    if(code==='ArrowLeft'||code==='KeyA')invUI.cursor=Math.max(0,invUI.cursor-1);
    else if(code==='ArrowRight'||code==='KeyD')invUI.cursor=Math.min(19,invUI.cursor+1);
    else if(code==='ArrowUp'||code==='KeyW')invUI.cursor=Math.max(0,invUI.cursor-5);
    else if(code==='ArrowDown'||code==='KeyS')invUI.cursor=Math.min(19,invUI.cursor+5);
    else if(code==='Enter'||code==='Space'||code==='KeyE'){
      if(invUI.mode==='gift'){
        if(inv.slots[invUI.cursor])giveGift(invUI.cursor);
        else message.show('SLOT KOSONG',1.2);
      }else{
        if(invUI.cursor<5&&inv.slots[invUI.cursor])inv.active=invUI.cursor;
      }
    }
    return;
  }
  if(game.paused){
    if(code==='Escape'){game.paused=false;lastT=performance.now();acc=0}
    return;
  }
  if(game.state==='title'){
    if(code==='Enter'||code==='Space'||code==='NumpadEnter'){
      Audio.sfx('enter');
      game.state='play';game.paused=false;game.time=0;
      if(game.hasSave){Save.load()}
      Save.save();
    }else if(code==='KeyL'&&game.hasSave){
      Audio.sfx('enter');
      game.state='play';game.paused=false;game.time=0;
      Save.load();
    }
    return;
  }
  if(code==='Escape'){game.paused=true;acc=0;Audio.sfx('menu')}
  else if(code==='KeyE'||code==='Space')interact();
  else if(code==='KeyQ')inv.cycle();
  else if(code==='Digit1'||code==='Digit2'||code==='Digit3'||code==='Digit4'||code==='Digit5'){
    const i=parseInt(code.charAt(5),10)-1;
    if(inv.slots[i])inv.active=i;
  }
  else if(code==='KeyI'){invUI.open=true;invUI.mode='normal';invUI.cursor=0;Audio.sfx('menu')}
  else if(code==='KeyC'){Collection.open=true;Audio.sfx('menu')}
  else if(code==='KeyM')Audio.toggle();
  else if(code==='KeyF'){if(Save.save())message.show('DISIMPAN',1.2);else message.show('GAGAL SIMPAN',1.5)}
}

/* ---------- 37. INIT ---------- */
function initInventory(){
  inv.slots[0]={id:'net',n:1};
  inv.slots[1]={id:'rod',n:1};
  inv.slots[2]={id:'shovel',n:1};
  inv.slots[3]={id:'axe',n:1};
  inv.slots[4]={id:'water',n:1};
  inv.slots[5]={id:'daun',n:3};
  inv.slots[6]={id:'bunga',n:2};
  inv.slots[7]={id:'apel',n:2};
  inv.slots[8]={id:'umpan',n:3};
  inv.active=0;
}
function init(){
  resize();
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)Save.save();
    lastT=performance.now();acc=0;
  });
  window.addEventListener('beforeunload',()=>Save.save());

  bakeSpriteAtlas();
  spriteTex=makeTexture(atlasCanvas);

  genWorld();
  buildAllChunks();

  for(const def of NPC_DEFS)npcs.push(makeNPC(def));
  initInventory();
  buildCollectionList();
  Touch.init();
  game.hasSave=Save.exists();

  player.x=28;player.z=23;player.dir='down';
  updateCamera(0);
  lastT=performance.now();
  acc=0;
  requestAnimationFrame(frame);
}
init();
</script>
