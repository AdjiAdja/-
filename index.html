/* ---------- MATH ---------- */
const V3={
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{const l=V3.len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]}
};
const M4={
  perspective:(fov,aspect,near,far)=>{
    const f=1/Math.tan(fov/2),nf=1/(near-far);
    return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]);
  },
  lookAt:(eye,tgt,up)=>{
    const z=V3.norm(V3.sub(eye,tgt));
    const x=V3.norm(V3.cross(up,z));
    const y=V3.cross(z,x);
    return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-V3.dot(x,eye),-V3.dot(y,eye),-V3.dot(z,eye),1]);
  }
};

/* ---------- UTILITAS ---------- */
function hash2(x,y,s){
  let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041);
  h=Math.imul(h^(h>>>13),1274126177);h=h^(h>>>16);
  return (h>>>0)/4294967296;
}
function mulberry32(a){
  return function(){
    a|=0;a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

function compileShader(t,src){
  const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s),src);throw new Error('shader')}
  return s;
}
function createProgram(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compileShader(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compileShader(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(p));throw new Error('program')}
  return p;
}

const voxelVS=`
attribute vec3 aPos;attribute vec3 aNormal;attribute vec3 aColor;
uniform mat4 uVP;uniform vec3 uLight;uniform vec3 uTint;
varying vec3 vColor;
void main(){
  gl_Position=uVP*vec4(aPos,1.0);
  float d=max(dot(normalize(aNormal),uLight),0.0);
  vColor=aColor*(0.55+d*0.55)*uTint;
}`;
const voxelFS=`precision mediump float;varying vec3 vColor;void main(){gl_FragColor=vec4(vColor,1.0);}`;
const voxelProg=createProgram(voxelVS,voxelFS);
const vLoc={
  aPos:gl.getAttribLocation(voxelProg,'aPos'),
  aNormal:gl.getAttribLocation(voxelProg,'aNormal'),
  aColor:gl.getAttribLocation(voxelProg,'aColor'),
  uVP:gl.getUniformLocation(voxelProg,'uVP'),
  uLight:gl.getUniformLocation(voxelProg,'uLight'),
  uTint:gl.getUniformLocation(voxelProg,'uTint')
};

const bbVS=`
attribute vec2 aPos;attribute vec2 aUV;attribute vec4 aCS;
uniform mat4 uVP;uniform vec3 uCamR;uniform vec3 uCamU;
varying vec2 vUV;varying vec3 vTintRgb;varying float vAlpha;
void main(){
  vec3 wp=aCS.xyz+uCamR*aPos.x*aCS.w+uCamU*aPos.y*aCS.w;
  vec4 cp=uVP*vec4(aCS.xyz,1.0);
  vec4 p=uVP*vec4(wp,1.0);
  p.z=cp.z;
  gl_Position=p;
  vUV=aUV;
}`;
const bbFS=`
precision mediump float;
uniform sampler2D uTex;
uniform vec4 uTint;
varying vec2 vUV;
void main(){
  vec4 c=texture2D(uTex,vUV);
  if(c.a<0.1)discard;
  gl_FragColor=vec4(c.rgb*uTint.rgb,c.a*uTint.a);
}`;
const bbProg=createProgram(bbVS,bbFS);
const bLoc={
  aPos:gl.getAttribLocation(bbProg,'aPos'),

const GKEYS=Object.keys(GLYPHS);const GIDX={};GKEYS.forEach((k,i)=>GIDX[k]=i);
const fontCache={};
function getFont(color){
  if(fontCache[color])return fontCache[color];
  const rows=Math.ceil(GKEYS.length/FCOLS);
  const cv=document.createElement('canvas');cv.width=FCOLS*FCW;cv.height=rows*FCH;
  const g=cv.getContext('2d');g.fillStyle=color;
  for(let i=0;i<GKEYS.length;i++){
    const bits=GLYPHS[GKEYS[i]];
    const ox=(i%FCOLS)*FCW,oy=Math.floor(i/FCOLS)*FCH;
    for(let r=0;r<FH;r++)for(let b=0;b<FW;b++){
      if(bits[r]&(1<<(FW-1-b)))g.fillRect(ox+b,oy+r,1,1);
    }
  }
  fontCache[color]=cv;return cv;
}
function tw(s){return s.length*FCW-1}
function drawText(str,x,y,rgb){
  const c='rgb('+Math.round(rgb[0]*255)+','+Math.round(rgb[1]*255)+','+Math.round(rgb[2]*255)+')';
  const a=getFont(c);str=String(str).toUpperCase();
  let cx=Math.round(x),cy=Math.round(y);
  for(let i=0;i<str.length;i++){
    const ch=str[i],idx=GIDX[ch];
    if(idx!==undefined&&ch!==' '){
      const sx=(idx%FCOLS)*FCW,sy=Math.floor(idx/FCOLS)*FCH;
      uctx.drawImage(a,sx,sy,FCW,FCH,cx,cy,FCW,FCH);
    }
    cx+=FCW;
  }
}
function drawTextC(str,cx,y,rgb){drawText(str,Math.round(cx-tw(str)/2),y,rgb)}
function panel(x,y,w,h){

}

const inv={slots:new Array(20).fill(null),active:0,
  add(id,n){
    n=n||1;const item=ITEMS[id];if(!item)return false;
    const max=item.isTool?1:99;
    for(let i=0;i<this.slots.length;i++){
      const s=this.slots[i];
      if(s&&s.id===id&&s.n<max){
        const a=Math.min(n,max-s.n);s.n+=a;n-=a;
        if(n<=0)return true;
      }
    }
    for(let i=0;i<this.slots.length;i++){
      if(!this.slots[i]){
        const a=Math.min(n,max);this.slots[i]={id,n:a};n-=a;
        if(n<=0)return true;
      }
    }
    return false;
  },
  removeAt(i,n){
    n=n||1;const s=this.slots[i];if(!s)return false;
    s.n-=n;if(s.n<=0)this.slots[i]=null;return true;
  },
  active_item(){return this.slots[this.active]},
  cycle(){
    for(let k=1;k<=5;k++){
      const i=(this.active+k)%5;
      if(this.slots[i]){this.active=i;return}
    }
  }
};

const ATLAS_W=64,ATLAS_H=16*16; // 4 frames × 16 rows
const spriteUV={};
let atlasCanvas=null;
function bakeSpriteAtlas(){
  atlasCanvas=document.createElement('canvas');
  atlasCanvas.width=ATLAS_W;atlasCanvas.height=ATLAS_H;
  const g=atlasCanvas.getContext('2d');g.imageSmoothingEnabled=false;
  function drawSprite(rows,pal,legs,x,y){
    for(let r=0;r<rows.length&&r<16;r++){
      const line=rows[r];
      for(let c=0;c<line.length&&c<16;c++){
        const ch=line[c];
        if(ch==='.'||ch==='0')continue;
        const col=pal[ch];if(!col)continue;
        g.fillStyle='rgb('+Math.round(col[0]*255)+','+Math.round(col[1]*255)+','+Math.round(col[2]*255)+')';
        g.fillRect(x+c,y+r,1,1);
      }
    }
    const lp=[.42,.60,.85],sh=[.28,.20,.15],ol=[.23,.16,.13];
    g.fillStyle='rgb('+Math.round(lp[0]*255)+','+Math.round(lp[1]*255)+','+Math.round(lp[2]*255)+')';
    g.fillRect(x+4,y+13,8,1);g.fillRect(x+4,y+14,8,1);
    g.fillStyle='rgb('+Math.round(ol[0]*255)+','+Math.round(ol[1]*255)+','+Math.round(ol[2]*255)+')';
    g.fillRect(x+3,y+15,4,1);g.fillRect(x+9,y+15,4,1);
  }
  // Player: 3 rows (down, up, side)
  for(let d=0;d<3;d++){
    const rows=d===0?PLAYER_DOWN:(d===1?PLAYER_UP:PLAYER_SIDE);
    for(let f=0;f<4;f++)drawSprite(rows,PAL_PLAYER,null,f*16,d*16);
  }
  // NPCs: rows 3-14 (3 each)
  for(let ni=0;ni<NPC_DEFS.length;ni++){
    const def=NPC_DEFS[ni];
    for(let d=0;d<3;d++){
      for(let f=0;f<4;f++){
        drawSprite(def.body,def.pal,def.legs,f*16,(3+ni*3+d)*16);
      }
    }
  }
  // White pixel row 15
  g.fillStyle='#fff';g.fillRect(0,15*16,16,16);
}
function makeTexture(c){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}

/* ---------- MESH ---------- */
function addQuad(aV,aC,aN,x1,y1,z1,x2,y2,z2,x3,y3,z3,x4,y4,z4,nx,ny,nz,col){
  aV.push(x1,y1,z1,x2,y2,z2,x3,y3,z3,x1,y1,z1,x3,y3,z3,x4,y4,z4);
  aN.push(nx,ny,nz,nx,ny,nz,nx,ny,nz,nx,ny,nz,nx,ny,nz,nx,ny,nz);
  for(let i=0;i<6;i++)aC.push(col[0],col[1],col[2]);
}
function addBox(aV,aC,aN,cx,cy,cz,sx,sy,sz,col){
  const hx=sx/2,hy=sy/2,hz=sz/2;
  const x0=cx-hx,x1=cx+hx,y0=cy-hy,y1=cy+hy,z0=cz-hz,z1=cz+hz;
  addQuad(aV,aC,aN,x0,y1,z0,x1,y1,z0,x1,y1,z1,x0,y1,z1,0,1,0,col);
  addQuad(aV,aC,aN,x0,y0,z1,x1,y0,z1,x1,y1,z1,x0,y1,z1,0,0,1,col);
  addQuad(aV,aC,aN,x1,y0,z0,x0,y0,z0,x0,y1,z0,x1,y1,z0,0,0,-1,col);
  addQuad(aV,aC,aN,x1,y0,z1,x1,y0,z0,x1,y1,z0,x1,y1,z1,1,0,0,col);
  addQuad(aV,aC,aN,x0,y0,z0,x0,y0,z1,x0,y1,z1,x0,y1,z0,-1,0,0,col);
}

/* ---------- TILE TYPES ---------- */
const T={GRASS:0,PATH:1,SAND:2,WATER:3,FLOOR:4,WALL:5,DOOR:6};

/* ---------- WORLD ---------- */
const ground=new Uint8Array(MAP_W*MAP_H);
const solid=new Uint8Array(MAP_W*MAP_H);
const occupied=new Uint8Array(MAP_W*MAP_H);
const waterV=new Uint8Array(MAP_W*MAP_H);
let objects=[];
let flowers=[];
let bugs=[];
let digSpots=[];
let chunks=[];

function getTile(tx,ty){
  if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return -1;
  return ground[ty*MAP_W+tx];
}
function setTile(tx,ty,t){if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return;ground[ty*MAP_W+tx]=t}
function isSolid(tx,ty){if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return true;return !!solid[ty*MAP_W+tx]}

function tileHeight(t){
  if(t===T.WATER)return 0.05;
  if(t===T.SAND)return 0.12;
  if(t===T.PATH)return 0.18;
  if(t===T.FLOOR)return 0.10;
  if(t===T.WALL)return 1.5;
  if(t===T.DOOR)return 0.10;
  return 0.15;
}
function tileColor(tx,ty,t){
  const n=hash2(tx,ty,7);
  const sm=Season.grassMod();
  if(t===T.WATER)return waterV[ty*MAP_W+tx]%2?COL.waterA:COL.waterB;
  if(t===T.PATH)return n>0.5?COL.pathA:COL.pathB;
  if(t===T.SAND)return n>0.5?COL.sandA:COL.sandB;
  if(t===T.FLOOR)return (tx+ty)%2?COL.floorA:COL.floorB;
  if(t===T.WALL)return COL.inWall;
  if(t===T.DOOR)return COL.wood;
  let col=n>0.85?COL.grassC:(n<0.15?COL.grassB:COL.grassA);
  return[col[0]*sm[0],col[1]*sm[1],col[2]*sm[2]];
}

/* ---------- DUNIA: GENERASI ---------- */
function genVillage(){
  const rng=mulberry32(20240607);
  for(let i=0;i<MAP_W*MAP_H;i++){ground[i]=T.GRASS;solid[i]=0;occupied[i]=0;waterV[i]=0}
  for(let tx=3;tx<=60;tx++){setTile(tx,24,T.PATH);setTile(tx,25,T.PATH)}
  for(let ty=3;ty<=45;ty++){setTile(30,ty,T.PATH);setTile(31,ty,T.PATH)}
  for(let ty=21;ty<=27;ty++)for(let tx=27;tx<=34;tx++)setTile(tx,ty,T.PATH);
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    const dx=(tx-47)/10.5,dy=(ty-11)/6.5;
    const d=dx*dx+dy*dy;
    if(d<=1){setTile(tx,ty,T.WATER);waterV[ty*MAP_W+tx]=(hash2(tx,ty,13)*3)|0}
    else if(d<=1.45&&getTile(tx,ty)===T.GRASS)setTile(tx,ty,T.SAND);
  }
  for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
    const i=ty*MAP_W+tx;
    if(ground[i]===T.WATER)solid[i]=1;
    if(tx===0||ty===0||tx===MAP_W-1||ty===MAP_H-1)solid[i]=1;
  }
  const hx=28,hy=20;
  objects.push({kind:'house',tx:hx,ty:hy,x:hx*TILE,y:0,z:hy*TILE,doorX:hx+0.5,doorZ:hy+1});
  for(let ty=hy-2;ty<=hy;ty++)for(let tx=hx-2;tx<=hx+1;tx++){
    if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)continue;
    solid[ty*MAP_W+tx]=1;occupied[ty*MAP_W+tx]=1;
  }
  objects.push({kind:'sign',tx:34,ty:22,x:34.5,y:0,z:22.5});
  for(let tx=0;tx<MAP_W;tx++)for(const ty of[0,1,MAP_H-2,MAP_H-1]){
    if(rng()<0.7&&!isSolid(tx,ty)&&!occupied[ty*MAP_W+tx])addTree(tx,ty,(rng()*3)|0);
  }
  for(let ty=0;ty<MAP_H;ty++)for(const tx of[0,1,MAP_W-2,MAP_W-1]){
    if(rng()<0.7&&!isSolid(tx,ty)&&!occupied[ty*MAP_W+tx])addTree(tx,ty,(rng()*3)|0);
  }
  for(let n=0;n<80;n++){
    const tx=2+((rng()*(MAP_W-4))|0);
    const ty=2+((rng()*(MAP_H-4))|0);
    if(getTile(tx,ty)===T.GRASS&&!isSolid(tx,ty)&&!occupied[ty*MAP_W+tx]&&rng()<0.55)addTree(tx,ty,(rng()*3)|0);
  }
  for(let n=0;n<50;n++){
    const tx=2+((rng()*(MAP_W-4))|0);
    const ty=2+((rng()*(MAP_H-4))|0);
    if(getTile(tx,ty)===T.GRASS&&!isSolid(tx,ty)&&!occupied[ty*MAP_W+tx]){
      if(rng()<0.6)addRock(tx,ty);else addBush(tx,ty);
    }
  }
  for(let ty=2;ty<MAP_H-2;ty++)for(let tx=2;tx<MAP_W-2;tx++){
    if(getTile(tx,ty)!==T.GRASS)continue;
    if(rng()<0.05){
      const alts=[[0.95,0.6,0.75],[0.97,0.85,0.45],[0.78,0.66,0.94],[0.97,0.63,0.54],[1,1,1]];
      flowers.push({tx,ty,x:tx+0.5,z:ty+0.5,color:alts[(rng()*5)|0]});
      occupied[ty*MAP_W+tx]=1;
    }
  }
  for(let ty=21;ty<=25;ty++)for(let tx=26;tx<=31;tx++){
    if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)continue;
    solid[ty*MAP_W+tx]=0;
  }
  objects=objects.filter(o=>{
    if(o.kind==='house'||o.kind==='sign')return true;
    if(o.tx>=26&&o.tx<=31&&o.ty>=21&&o.ty<=25)return false;
    return true;
  });
}
function addTree(tx,ty,v){
  if(isSolid(tx,ty)||occupied[ty*MAP_W+tx])return;
  solid[ty*MAP_W+tx]=1;occupied[ty*MAP_W+tx]=1;
  objects.push({kind:'tree',tx,ty,x:tx+0.5,y:0,z:ty+0.5,hp:3,v});
}
function addRock(tx,ty){
  if(isSolid(tx,ty)||occupied[ty*MAP_W+tx])return;
  solid[ty*MAP_W+tx]=1;occupied[ty*MAP_W+tx]=1;
  objects.push({kind:'rock',tx,ty,x:tx+0.5,y:0,z:ty+0.5});
}
function addBush(tx,ty){
  if(isSolid(tx,ty)||occupied[ty*MAP_W+tx])return;
  solid[ty*MAP_W+tx]=1;occupied[ty*MAP_W+tx]=1;
  objects.push({kind:'bush',tx,ty,x:tx+0.5,y:0,z:ty+0.5});
}

/* ---------- CHUNK BUILD ---------- */
function buildChunk(cx,cy){
  const aV=[],aC=[],aN=[];
  const x0=cx*CHUNK,y0=cy*CHUNK;
  const x1=Math.min(x0+CHUNK,MAP_W),y1=Math.min(y0+CHUNK,MAP_H);
  for(let ty=y0;ty<y1;ty++)for(let tx=x0;tx<x1;tx++){
    const t=ground[ty*MAP_W+tx];
    const h=tileHeight(t);
    const col=tileColor(tx,ty,t);
    const z=ty*TILE,zz=z+TILE,x=tx*TILE,xx=x+TILE;
    if(t===T.WALL){
      addBox(aV,aC,aN,x+0.5,h/2,z+0.5,1,h,1,col);
      addBox(aV,aC,aN,x+0.5,h+0.15,z+0.5,1.05,0.3,1.05,COL.inWallTop);
    }else{
      addQuad(aV,aC,aN,x,h,z,xx,h,z,xx,h,zz,x,h,zz,0,1,0,col);
    }
  }
  for(let ty=y0;ty<y1;ty++)for(let tx=x0;tx<x1;tx++){
    const t=ground[ty*MAP_W+tx];
    if(t===T.WALL)continue;
    const h=tileHeight(t);
    const base=tileColor(tx,ty,t);
    const col=[base[0]*0.8,base[1]*0.8,base[2]*0.8];
    const nx=getTile(tx+1,ty),nz=getTile(tx,ty+1),px=getTile(tx-1,ty),pz=getTile(tx,ty-1);
    if(nx>=0&&nx!==T.WALL&&tileHeight(nx)<h-0.001){
      const x=tx*TILE+TILE,z=ty*TILE,zz=z+TILE;
      addQuad(aV,aC,aN,x,h,z,x,tileHeight(nx),z,x,tileHeight(nx),zz,x,h,zz,1,0,0,col);
    }
    if(nz>=0&&nz!==T.WALL&&tileHeight(nz)<h-0.001){
      const z=ty*TILE+TILE,x=tx*TILE,xx=x+TILE;
      addQuad(aV,aC,aN,x,h,z,xx,h,z,xx,tileHeight(nz),z,x,tileHeight(nz),z,0,0,1,col);
    }
  }
  for(let i=0;i<objects.length;i++){
    const o=objects[i];
    if(o.tx<x0||o.tx>=x1||o.ty<y0||o.ty>=y1)continue;
    const bx=o.tx*TILE+TILE/2,bz=o.ty*TILE+TILE/2;
    const gy=tileHeight(ground[o.ty*MAP_W+o.tx]);
    const lm=Season.leafMod();
    const leafA=[COL.leafA[0]*lm[0],COL.leafA[1]*lm[1],COL.leafA[2]*lm[2]];
    const leafB=[COL.leafB[0]*lm[0],COL.leafB[1]*lm[1],COL.leafB[2]*lm[2]];
    const leafC=[COL.leafC[0]*lm[0],COL.leafC[1]*lm[1],COL.leafC[2]*lm[2]];
    if(o.kind==='tree')buildTree(aV,aC,aN,bx,gy,bz,o.v||0,leafA,leafB,leafC);
    else if(o.kind==='rock')buildRock(aV,aC,aN,bx,gy,bz);
    else if(o.kind==='bush')buildBush(aV,aC,aN,bx,gy,bz,leafA,leafB);
    else if(o.kind==='house')buildHouse(aV,aC,aN,o.tx*TILE,(o.ty-2)*TILE);
    else if(o.kind==='sign')buildSign(aV,aC,aN,bx,gy,bz);
    else if(o.kind==='furn_bed')buildBed(aV,aC,aN,bx,gy,bz);
    else if(o.kind==='furn_table')buildTable(aV,aC,aN,bx,gy,bz);
    else if(o.kind==='furn_chair')buildChair(aV,aC,aN,bx,gy,bz);
    else if(o.kind==='furn_plant')buildPotPlant(aV,aC,aN,bx,gy,bz,leafA,leafB);
    else if(o.kind==='grow')buildGrow(aV,aC,aN,bx,gy,bz,o,leafA,leafB,leafC);
    else if(o.kind==='stump')buildStump(aV,aC,aN,bx,gy,bz);
  }
  for(let i=0;i<flowers.length;i++){
    const f=flowers[i];
    if(f.tx<x0||f.tx>=x1||f.ty<y0||f.ty>=y1)continue;
    const gy=tileHeight(ground[f.ty*MAP_W+f.tx]);
    addBox(aV,aC,aN,f.x,gy+0.15,f.z,0.15,0.15,0.15,f.color);
  }
  return{aV,aC,aN,x0,y0,x1,y1};
}
function buildTree(v,cols,norms,x,gy,z,varId,leafA,leafB,leafC){
  addBox(v,cols,norms,x,gy+0.9,z,0.35,1.8,0.35,COL.trunk);
  const bY=gy+2.0;
  addBox(v,cols,norms,x,bY+0.3,z,1.4,0.9,1.4,leafA);
  addBox(v,cols,norms,x,bY+1.1,z,1.2,0.8,1.2,leafB);
  addBox(v,cols,norms,x,bY+1.9,z,0.9,0.8,0.9,leafC);
  addBox(v,cols,norms,x,bY+2.5,z,0.5,0.5,0.5,leafC);
  if(varId===1){
    addBox(v,cols,norms,x+0.4,bY+0.9,z-0.2,0.2,0.2,0.2,[0.95,0.63,0.63]);
    addBox(v,cols,norms,x-0.3,bY+1.5,z+0.2,0.2,0.2,0.2,[0.95,0.63,0.63]);
  }
}
function buildGrow(v,c,n,x,gy,z,o,leafA,leafB,leafC){
  const s=o.stage||0;
  if(s===0){
    addBox(v,c,n,x,gy+0.12,z,0.15,0.24,0.15,[0.4,0.7,0.3]);
  }else if(s===1){
    addBox(v,c,n,x,gy+0.35,z,0.2,0.7,0.2,COL.trunk);
    addBox(v,c,n,x,gy+0.8,z,0.5,0.5,0.5,leafA);
  }else if(s===2){
    addBox(v,c,n,x,gy+0.7,z,0.3,1.4,0.3,COL.trunk);
    addBox(v,c,n,x,gy+1.7,z,0.9,0.9,0.9,leafB);
  }else{
    buildTree(v,c,n,x,gy,z,o.variant||0,leafA,leafB,leafC);
  }
}
function buildStump(v,c,n,x,gy,z){
  addBox(v,c,n,x,gy+0.2,z,0.5,0.4,0.5,COL.trunkD);

/* ---------- CHUNKS ---------- */
function uploadChunkBuffers(data){
  if(data.aV.length===0)return null;
  const posBuf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.aV),gl.STATIC_DRAW);
  const colBuf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,colBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.aC),gl.STATIC_DRAW);
  const nrmBuf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,nrmBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.aN),gl.STATIC_DRAW);
  return{posBuf,colBuf,nrmBuf,count:data.aV.length/3};
}
function freeChunks(){
  for(const ch of chunks){
    if(ch){gl.deleteBuffer(ch.posBuf);gl.deleteBuffer(ch.colBuf);gl.deleteBuffer(ch.nrmBuf)}
  }
  chunks.length=0;
}
function buildAllChunks(){
  freeChunks();
  for(let cy=0;cy<NUM_CY;cy++)for(let cx=0;cx<NUM_CX;cx++){
    const data=buildChunk(cx,cy);
    chunks.push(uploadChunkBuffers(data));
  }
}
function rebuildAllChunks(){
  buildAllChunks();
}
function rebuildChunk(cx,cy){
  if(cx<0||cy<0||cx>=NUM_CX||cy>=NUM_CY)return;
  const i=cy*NUM_CX+cx;
  const old=chunks[i];
  if(old){gl.deleteBuffer(old.posBuf);gl.deleteBuffer(old.colBuf);gl.deleteBuffer(old.nrmBuf)}
  const data=buildChunk(cx,cy);
  chunks[i]=uploadChunkBuffers(data);
}

/* ---------- COLLISION ---------- */
const P_HW=0.35,P_HH=0.4;
function collides(px,pz,hw,hh){
  const bx=px-hw,bz=pz-hh,bx2=px+hw,bz2=pz+hh;
  const tx0=Math.floor(bx),tx1=Math.floor(bx2);
  const ty0=Math.floor(bz),ty1=Math.floor(bz2);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    if(isSolid(tx,ty))return true;
  }
  return false;
}
function tryMove(ent,dx,dz,hw,hh){
  if(dx!==0&&!collides(ent.x+dx,ent.z,hw,hh))ent.x+=dx;
  if(dz!==0&&!collides(ent.x,ent.z+dz,hw,hh))ent.z+=dz;
}

/* ---------- NPC ---------- */
function makeNPC(def){
  return{
    def,name:def.name,personality:def.personality,
    x:def.spawnX,z:def.spawnZ,homeX:def.spawnX,homeZ:def.spawnZ,
    dir:'down',frame:0,animT:0,
    state:'idle',timer:1+Math.random()*2,
    affinity:0,
    getGreet(){
      const t=this.affinity>=3?'f':(this.affinity>=1?'a':'s');
      const pool=this.def.greet[t];
      return pool[(Math.random()*pool.length)|0];
    }
  };
}
function updateNPCs(dt){
  const phase=TimeSys.phase().toLowerCase();
  for(const npc of npcs){
    if(dialog.active&&dialog.npc===npc)continue;
    npc.timer-=dt;
    const sched=npc.def.sched?npc.def.sched[phase]:null;
    const targetX=sched?sched[0]:npc.homeX;
    const targetZ=sched?sched[1]:npc.homeZ;
    const ddx=npc.x-targetX,ddz=npc.z-targetZ;
    const dhome=Math.sqrt(ddx*ddx+ddz*ddz);
    // If far from schedule target, walk towards it
    if(dhome>2.5&&npc.state!=='arrive'){
      npc.state='arrive';
      const l=dhome||1;
      const sp=NPC_SPEED*dt;
      const ox=npc.x,oz=npc.z;
      tryMove(npc,-ddx/l*sp,-ddz/l*sp,0.35,0.4);
      if(Math.abs(ddx)>Math.abs(ddz))npc.dir=ddx>0?'left':'right';
      else npc.dir=ddz>0?'up':'down';
      npc.animT+=dt;
      npc.frame=Math.floor(npc.animT*6)%4;
      if(Math.abs(npc.x-ox)<0.001&&Math.abs(npc.z-oz)<0.001){npc.timer=0;npc.state='idle'}
      continue;
    }
    if(npc.state==='arrive')npc.state='idle';
    if(npc.state==='idle'){
      if(npc.timer<=0){
        const r=Math.random();
        if(r<0.6){
          npc.state='walk';npc.timer=1.5+Math.random()*2.5;
          npc.dir=['down','up','left','right'][(Math.random()*4)|0];
        }else npc.timer=1.5+Math.random()*2.5;
      }
      npc.frame=0;
    }else{
      let mx=0,mz=0;
      if(npc.dir==='down')mz=1;
      else if(npc.dir==='up')mz=-1;
      else if(npc.dir==='left')mx=-1;
      else mx=1;
      const sp=NPC_SPEED*dt;
      const ox=npc.x,oz=npc.z;
      tryMove(npc,mx*sp,mz*sp,0.35,0.4);
      if(Math.abs(npc.x-ox)<0.001&&Math.abs(npc.z-oz)<0.001)npc.timer=0;
      npc.animT+=dt;
      npc.frame=Math.floor(npc.animT*6)%4;
      if(npc.timer<=0){npc.state='idle';npc.timer=1+Math.random()*3;npc.frame=0}
    }
  }
}

/* ---------- DIALOG ---------- */
const dialog={active:false,npc:null,lines:[],idx:0,full:'',text:'',t:0,done:false};
function face(ent,tx,tz){
  const dx=tx-ent.x,dz=tz-ent.z;
  if(Math.abs(dx)>Math.abs(dz))ent.dir=dx>0?'right':'left';
  else ent.dir=dz>0?'down':'up';
}
function startDialog(npc){
  dialog.active=true;dialog.npc=npc;
  dialog.lines=[npc.getGreet()];dialog.idx=0;
  dialog.full=dialog.lines[0];dialog.text='';dialog.t=0;dialog.done=false;
  face(npc,player.x,player.z);face(player,npc.x,npc.z);
  Audio.sfx('dialog');
}
function advanceDialog(){
  if(!dialog.active)return;
  if(!dialog.done){dialog.text=dialog.full;dialog.done=true;return}
  dialog.idx++;
  if(dialog.idx>=dialog.lines.length){closeDialog();return}
  dialog.full=dialog.lines[dialog.idx];dialog.text='';dialog.t=0;dialog.done=false;
  Audio.sfx('dialog');
}
function closeDialog(){dialog.active=false;dialog.npc=null;dialog.lines=[]}
function updateDialog(dt){
  if(!dialog.active||dialog.done)return;
  dialog.t+=dt;
  const n=Math.floor(dialog.t*45);
  if(n>=dialog.full.length){dialog.text=dialog.full;dialog.done=true}
  else dialog.text=dialog.full.substring(0,n);
}
function npcReact(npc,id){
  const it=ITEMS[id];if(!it)return'HMM?';
  const s=(it.gift||1)+npc.affinity;
  if(npc.personality==='cheerful')return s>=5?'WAAAH! MAKASIH YA~':(s>=3?'TERIMA KASIH! AKU SUKA.':'HEHE MAKASIH!');
  if(npc.personality==='gruff')return s>=5?'HMM... BAGUS. MAKASIH.':(s>=3?'OH... MAKASIH.':'MAKASIH YA.');
  if(npc.personality==='sleepy')return s>=5?'NYAA~ MAKASIH...':(s>=3?'NYA... MAKASIH...':'NYA~');
  return s>=5?'ADUH MANIS! MAKASIH SAYANG~':(s>=3?'IH MAKASIH!':'MAKASIH SAYANG.');
}
function giveGift(idx){
  const slot=inv.slots[idx];if(!slot)return false;
  if(ITEMS[slot.id].isTool){message.show('TIDAK BISA MEMBERI ALAT',1.5);Audio.sfx('error');return false}
  const npc=dialog.npc;if(!npc)return false;
  const r=npcReact(npc,slot.id);
  inv.removeAt(idx,1);npc.affinity=Math.min(10,npc.affinity+1);
  dialog.lines=[r];dialog.idx=0;dialog.full=r;dialog.text='';dialog.t=0;dialog.done=false;
  invUI.open=false;invUI.mode='normal';
  Audio.sfx('gift');return true;
}

/* ---------- PANCING ---------- */
const FISH=[{id:'ikan_kecil',w:45,h0:0,h1:24},{id:'ikan_sedang',w:30,h0:6,h1:22},{id:'ikan_besar',w:10,h0:10,h1:18},{id:'udang',w:15,h0:18,h1:6}];
function pickFish(){
  const h=TimeSys.hour;let tot=0;const av=[];
  for(const f of FISH){
    const ok=f.h0<f.h1?(h>=f.h0&&h<f.h1):(h>=f.h0||h<f.h1);
    if(ok){av.push(f);tot+=f.w}
  }
  if(!av.length)return'ikan_kecil';
  let r=Math.random()*tot;
  for(const f of av){r-=f.w;if(r<=0)return f.id}
  return av[av.length-1].id;
}
function findFishSpot(){
  let tx=Math.floor(player.x),tz=Math.floor(player.z);
  let dx=0,dz=0;
  if(player.dir==='down')dz=1;else if(player.dir==='up')dz=-1;else if(player.dir==='left')dx=-1;else dx=1;
  for(let r=1;r<=2;r++){
    if(getTile(tx+dx*r,tz+dz*r)===T.WATER)return{x:(tx+dx*r)+0.5,z:(tz+dz*r)+0.5}
  }
  return null;
}
const fishing={state:'idle',timer:0,cx:0,cz:0,cursor:0,dir:1,speed:220,result:'',umpan:false};
function startFishing(){
  const spot=findFishSpot();
  if(!spot){message.show('HADAP AIR UNTUK MEMANCING',1.5);Audio.sfx('error');return}
  fishing.state='casting';fishing.timer=0.4;fishing.cx=spot.x;fishing.cz=spot.z;fishing.umpan=false;
  for(let i=0;i<inv.slots.length;i++){
    if(inv.slots[i]&&inv.slots[i].id==='umpan'){inv.removeAt(i,1);fishing.umpan=true;break}
  }
  Audio.sfx('cast');
}
function updateFishing(dt){
  if(fishing.state==='idle')return;
  fishing.timer-=dt;
  if(fishing.state==='casting'){if(fishing.timer<=0){fishing.state='waiting';fishing.timer=fishing.umpan?0.6+Math.random()*1.2:1.5+Math.random()*2.5}}
  else if(fishing.state==='waiting'){if(fishing.timer<=0){fishing.state='bite';fishing.timer=1.2;Audio.sfx('bite')}}
  else if(fishing.state==='bite'){if(fishing.timer<=0){fishing.state='idle';message.show('IKAN KABUR...',1.5)}}
  else if(fishing.state==='minigame'){
    fishing.cursor+=fishing.dir*fishing.speed*dt;
    if(fishing.cursor>100){fishing.cursor=100;fishing.dir=-1}
    if(fishing.cursor<0){fishing.cursor=0;fishing.dir=1}
  }else if(fishing.state==='result'){if(fishing.timer<=0)fishing.state='idle'}
}
function fishingPress(){
  if(fishing.state==='bite'){fishing.state='minigame';fishing.cursor=0;fishing.dir=1;fishing.speed=200+Math.random()*80}
  else if(fishing.state==='minigame'){
    const ok=fishing.cursor>=35&&fishing.cursor<=65;
    if(ok){const id=pickFish();inv.add(id,1);fishing.result='DAPAT '+ITEMS[id].name+'!';Collection.mark(id);Audio.sfx('catch')}
    else{fishing.result='IKAN LEPAS...';Audio.sfx('miss')}
    fishing.state='result';fishing.timer=1.6;
  }
}

/* ---------- SERANGGA ---------- */
const BUGS=[{id:'kupu',w:50,h0:6,h1:18},{id:'kumbang',w:25,h0:18,h1:6},{id:'belalang',w:25,h0:6,h1:18}];
let bugTimer=5;
function pickBug(){
  const h=TimeSys.hour;let tot=0;const av=[];
  for(const b of BUGS){
    const ok=b.h0<b.h1?(h>=b.h0&&h<b.h1):(h>=b.h0||h<b.h1);
    if(ok){av.push(b);tot+=b.w}
  }
  if(!av.length)return'kupu';
  let r=Math.random()*tot;
  for(const b of av){r-=b.w;if(r<=0)return b.id}
  return av[av.length-1].id;
}
function spawnBug(){
  if(bugs.length>=5)return;
  for(let t=0;t<8;t++){
    const a=Math.random()*Math.PI*2,d=2+Math.random()*3;
    const bx=player.x+Math.cos(a)*d,bz=player.z+Math.sin(a)*d;
    const tx=Math.floor(bx),ty=Math.floor(bz);
    if(getTile(tx,ty)!==T.GRASS)continue;
    if(isSolid(tx,ty))continue;
    bugs.push({id:pickBug(),x:bx,z:bz,phase:Math.random()*6,timer:12+Math.random()*10});
    return;
  }
}
function updateBugs(dt){
  if(player.scene!=='world'){bugs.length=0;return}
  bugTimer-=dt;
  if(bugTimer<=0){bugTimer=6+Math.random()*6;if(Math.random()<0.7)spawnBug()}
  for(let i=bugs.length-1;i>=0;i--){bugs[i].timer-=dt;bugs[i].phase+=dt*3;if(bugs[i].timer<=0)bugs.splice(i,1)}
}
function tryCatchBug(){
  let n=null,bd=2.0;
  for(const b of bugs){const d=Math.hypot(b.x-player.x,b.z-player.z);if(d<bd){bd=d;n=b}}
  if(!n){message.show('TIDAK ADA SERANGGA',1.2);Audio.sfx('error');return}
  inv.add(n.id,1);Collection.mark(n.id);
  message.show('DAPAT '+ITEMS[n.id].name.toUpperCase()+'!',1.8);
  Audio.sfx('catch');
  const i=bugs.indexOf(n);if(i>=0)bugs.splice(i,1);
}

/* ---------- GALI ---------- */
let digTimer=8;
function spawnDig(){
  if(digSpots.length>=3)return;
  for(let t=0;t<8;t++){
    const a=Math.random()*Math.PI*2,d=3+Math.random()*4;
    const bx=player.x+Math.cos(a)*d,bz=player.z+Math.sin(a)*d;
    const tx=Math.floor(bx),ty=Math.floor(bz);
    if(getTile(tx,ty)!==T.GRASS)continue;
    if(isSolid(tx,ty))continue;
    digSpots.push({tx,ty,x:tx+0.5,z:ty+0.5,timer:25});
    return;
  }
}
function updateDig(dt){
  if(player.scene!=='world'){digSpots.length=0;return}
  digTimer-=dt;
  if(digTimer<=0){digTimer=10+Math.random()*8;spawnDig()}
  for(let i=digSpots.length-1;i>=0;i--){digSpots[i].timer-=dt;if(digSpots[i].timer<=0)digSpots.splice(i,1)}
}
function tryDig(){
  let n=null,bd=1.5;
  for(const d of digSpots){const dd=Math.hypot(d.x-player.x,d.z-player.z);if(dd<bd){bd=dd;n=d}}
  if(!n){message.show('TIDAK ADA GALIAN',1.2);Audio.sfx('error');return}
  const r=Math.random();let id;
  if(r<0.35)id='fosil';else if(r<0.6)id='seed';else if(r<0.8)id='umpan';else id='apel';
  inv.add(id,1);Collection.mark(id);
  message.show('DAPAT '+ITEMS[id].name.toUpperCase()+'!',1.8);
  Audio.sfx('dig');
  const i=digSpots.indexOf(n);if(i>=0)digSpots.splice(i,1);
}

/* ---------- TEBANG ---------- */
function tryChop(){
  let n=null,bd=2.2;
  for(const o of objects){
    if(o.kind!=='tree')continue;
    const d=Math.hypot(o.x-player.x,o.z-player.z);
    if(d<bd){bd=d;n=o}
  }
  if(!n){message.show('TIDAK ADA POHON DEKAT',1.2);Audio.sfx('error');return}
  if(n.hp===undefined)n.hp=3;
  n.hp--;
  Audio.sfx('chop');
  if(n.hp<=0){
    inv.add('wood',2+((Math.random()*3)|0));
    if(Math.random()<0.4)inv.add('apel',1);
    message.show('POHON TUMBANG!',1.6);
    Audio.sfx('treefall');
    const i=objects.indexOf(n);
    if(i>=0)objects.splice(i,1);
    // Add stump that grows back
    objects.push({kind:'stump',tx:n.tx,ty:n.ty,x:n.x,y:0,z:n.z,regrowT:0});
    rebuildChunk(Math.floor(n.tx/CHUNK),Math.floor(n.ty/CHUNK));
  }else{
    message.show('TEBANG LAGI! ('+n.hp+'X)',1.2);
    inv.add('wood',1);
  }
}

/* ---------- TANAM ---------- */
function tryPlant(){
  let si=-1,isTree=false;
  for(let i=0;i<inv.slots.length;i++){
    if(inv.slots[i]&&inv.slots[i].id==='seed'){si=i;isTree=false;break}
    if(inv.slots[i]&&inv.slots[i].id==='seed_pohon'){si=i;isTree=true;break}
  }
  if(si<0){message.show('TIDAK ADA BIBIT',1.2);Audio.sfx('error');return}
  let tx=Math.floor(player.x),ty=Math.floor(player.z);
  if(player.dir==='down')ty++;else if(player.dir==='up')ty--;
  else if(player.dir==='left')tx--;else tx++;
  if(getTile(tx,ty)!==T.GRASS||isSolid(tx,ty)){message.show('TIDAK BISA MENANAM DI SINI',1.2);Audio.sfx('error');return}
  inv.removeAt(si,1);
  if(isTree){
    objects.push({kind:'grow',tx,ty,x:tx+0.5,y:0,z:ty+0.5,stage:0,growT:0,variant:(tx+ty)%3});
    solid[ty*MAP_W+tx]=1;occupied[ty*MAP_W+tx]=1;
    message.show('BIBIT POHON DITANAM',1.5);
  }else{
    const alts=[[0.95,0.6,0.75],[0.97,0.85,0.45],[0.78,0.66,0.94],[0.97,0.63,0.54],[1,1,1]];
    flowers.push({tx,ty,x:tx+0.5,z:ty+0.5,color:alts[(Math.random()*5)|0]});
    message.show('BUNGA DITANAM',1.5);
  }
  Audio.sfx('plant');
  rebuildChunk(Math.floor(tx/CHUNK),Math.floor(ty/CHUNK));
}
function updateGrow(dt){
  for(const o of objects){
    if(o.kind==='grow'){
      o.growT=(o.growT||0)+dt;
      if(o.growT>15&&(o.stage||0)<3){
        o.stage=(o.stage||0)+1;o.growT=0;
        rebuildChunk(Math.floor(o.tx/CHUNK),Math.floor(o.ty/CHUNK));
        if(o.stage===3){
          // Convert to tree
          const i=objects.indexOf(o);
          if(i>=0){
            objects.splice(i,1);
            objects.push({kind:'tree',tx:o.tx,ty:o.ty,x:o.x,y:0,z:o.z,hp:3,v:o.variant||0});
            rebuildChunk(Math.floor(o.tx/CHUNK),Math.floor(o.ty/CHUNK));
          }
        }
      }
    }else if(o.kind==='stump'){
      o.regrowT=(o.regrowT||0)+dt;
      if(o.regrowT>20){
        const i=objects.indexOf(o);
        if(i>=0){
          objects.splice(i,1);
          objects.push({kind:'tree',tx:o.tx,ty:o.ty,x:o.x,y:0,z:o.z,hp:3,v:(o.tx+o.ty)%3});
          rebuildChunk(Math.floor(o.tx/CHUNK),Math.floor(o.ty/CHUNK));
        }
      }
    }
  }
}

function enterInterior(){
  if(player.scene==='interior')return;
  // Save village
  savedVillage.ground=ground.slice();
  savedVillage.solid=solid.slice();
  savedVillage.occupied=occupied.slice();
  savedVillage.waterV=waterV.slice();
  savedVillage.objects=objects;
  savedVillage.flowers=flowers;
  savedVillage.chunks=chunks;
  savedVillage.px=player.x;savedVillage.pz=player.z;
  // Build interior
  genInterior();
  buildAllChunks();
  player.x=6.5;player.z=7.5;
  player.scene='interior';player.dir='up';
  camera.dist=6;camera.pitch=0.95;
  Audio.sfx('enter');
  message.show('RUMAH',1.2);
}
function exitInterior(){
  if(player.scene!=='interior')return;
  // Delete interior chunks
  freeChunks();
  // Restore village
  ground.set(savedVillage.ground);
  solid.set(savedVillage.solid);
  occupied.set(savedVillage.occupied);
  waterV.set(savedVillage.waterV);
  objects=savedVillage.objects;
  flowers=savedVillage.flowers;
  chunks=savedVillage.chunks;
  const house=objects.find(o=>o.kind==='house');
  if(house){player.x=house.doorX;player.z=house.doorZ+1.5}
  player.scene='world';player.dir='down';
  camera.dist=9;camera.pitch=0.85;
  Audio.sfx('enter');
  message.show('DESA',1.2);
}

/* ---------- AUDIO ---------- */
const Audio={
  ctx:null,master:null,muted:false,ambTimer:0,ambIdx:0,
  init(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=0.35;this.master.connect(this.ctx.destination);return true}catch(e){return false}},
  gesture(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})},
  toggle(){this.muted=!this.muted;if(this.master)this.master.gain.value=this.muted?0:0.35;message.show(this.muted?'SUARA MATI':'SUARA HIDUP',1.2)},
  sfx(name){
    if(!this.ctx||this.muted)return;
    const c=this.ctx,t=c.currentTime;
    const mk=(f,ty,d,v,sl)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type=ty||'square';o.frequency.setValueAtTime(f,t);
      if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sl),t+d);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||0.1,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+d);
      o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+0.02);
    };
    switch(name){
      case'dialog':mk(520,'square',0.06,0.06);break;
      case'gift':mk(660,'square',0.1,0.1);setTimeout(()=>mk(880,'square',0.15,0.1),90);break;
      case'catch':mk(700,'square',0.08,0.12);setTimeout(()=>mk(1000,'square',0.1,0.12),60);setTimeout(()=>mk(1320,'square',0.14,0.12),130);break;
      case'cast':mk(400,'triangle',0.12,0.08,0.5);break;
      case'bite':mk(900,'square',0.08,0.1);setTimeout(()=>mk(1200,'square',0.08,0.1),70);break;
      case'miss':mk(300,'sawtooth',0.2,0.08,0.5);break;
      case'dig':mk(220,'square',0.1,0.08,0.7);break;
      case'chop':mk(160,'square',0.1,0.1,0.5);break;
      case'treefall':mk(120,'sawtooth',0.4,0.12,0.4);break;
      case'plant':mk(500,'triangle',0.1,0.08);setTimeout(()=>mk(750,'triangle',0.1,0.08),80);break;
      case'buy':mk(880,'square',0.08,0.1);setTimeout(()=>mk(1100,'square',0.1,0.1),60);break;
      case'sell':mk(1100,'square',0.08,0.1);setTimeout(()=>mk(880,'square',0.1,0.1),60);break;
      case'error':mk(200,'sawtooth',0.15,0.08);break;
      case'menu':mk(660,'square',0.05,0.06);break;
      case'enter':mk(500,'triangle',0.15,0.1);setTimeout(()=>mk(750,'triangle',0.2,0.1),120);break;
    }
  },
  tick(dt){
    if(!this.ctx||this.muted)return;
    this.ambTimer-=dt;
    if(this.ambTimer<=0){
      this.ambTimer=3.6+Math.random()*1.2;
      const sc=[261.63,293.66,329.63,392.00,440.00,523.25];
      const n=sc[this.ambIdx%sc.length];this.ambIdx++;
      const c=this.ctx,t=c.currentTime;
      const o=c.createOscillator(),g=c.createGain();
      o.type='triangle';o.frequency.setValueAtTime(n,t);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.05,t+0.4);
      g.gain.exponentialRampToValueAtTime(0.001,t+2.0);
      o.connect(g);g.connect(this.master);o.start(t);o.stop(t+2.1);
    }
  }
};

function addBB(cx,cy,cz,size,u0,v0,u1,v1,tint){
  tintStack.push(tint);

/* ---------- TOUCH ---------- */
const Touch={
  active:false,axisX:0,axisZ:0,joyId:null,joySX:0,joySY:0,
  camId:null,camLX:0,camLY:0,
  btn:{A:false,B:false,C:false,M:false},
  buttons:[],
  init(){
    const isT=('ontouchstart'in window)||navigator.maxTouchPoints>0;
    if(!isT)return;
    this.active=true;
    this.buttons=[
      {id:'A',x:UI_W-42,y:UI_H-42,r:16},
      {id:'B',x:UI_W-72,y:UI_H-30,r:13},
      {id:'C',x:UI_W-30,y:30,r:11},
      {id:'M',x:UI_W-58,y:30,r:11}
    ];
    const toUI=(sx,sy)=>({x:(sx-uiOffX)/uiScale,y:(sy-uiOffY)/uiScale});
    const hit=(ux,uy)=>{
      for(const b of this.buttons){if(Math.hypot(ux-b.x,uy-b.y)<b.r+4)return b}
      return null;
    };
    const joyR={x:0,y:UI_H-65,w:65,h:65};
    const inJoy=(ux,uy)=>ux>=joyR.x&&ux<=joyR.x+joyR.w&&uy>=joyR.y&&uy<=joyR.y+joyR.h;
    window.addEventListener('touchstart',(e)=>{
      Audio.gesture();
      for(const t of e.changedTouches){
        const p=toUI(t.clientX,t.clientY);
        const b=hit(p.x,p.y);
        if(b){this.press(b.id)}
        else if(inJoy(p.x,p.y)){
          this.joyId=t.identifier;this.joySX=p.x;this.joySY=p.y;this.axisX=0;this.axisZ=0;
        }else if(this.camId===null){
          this.camId=t.identifier;this.camLX=t.clientX;this.camLY=t.clientY;
        }
      }
    },{passive:false});
    window.addEventListener('touchmove',(e)=>{
      for(const t of e.changedTouches){
        if(t.identifier===this.joyId){
          const p=toUI(t.clientX,t.clientY);
          const dx=p.x-this.joySX,dy=p.y-this.joySY,r=28;
          this.axisX=Math.max(-1,Math.min(1,dx/r));
          this.axisZ=Math.max(-1,Math.min(1,dy/r));
        }else if(t.identifier===this.camId){
          const dx=t.clientX-this.camLX,dy=t.clientY-this.camLY;
          this.camLX=t.clientX;this.camLY=t.clientY;
          camera.yaw-=dx*0.008;
          camera.pitch=Math.max(0.3,Math.min(1.4,camera.pitch+dy*0.005));
        }
      }
    },{passive:false});
    const end=(e)=>{
      for(const t of e.changedTouches){
        if(t.identifier===this.joyId){this.joyId=null;this.axisX=0;this.axisZ=0}
        else if(t.identifier===this.camId){this.camId=null}
      }
      if(e.touches.length===0)this.btn.A=this.btn.B=this.btn.C=this.btn.M=false;
    };
    window.addEventListener('touchend',end,{passive:false});
    window.addEventListener('touchcancel',end,{passive:false});
  },
  press(id){
    this.btn[id]=true;
    setTimeout(()=>{this.btn[id]=false},150);
    if(id==='A')onKey('KeyE');
    else if(id==='B')onKey('KeyI');
    else if(id==='C')onKey('KeyC');
    else if(id==='M')Audio.toggle();
  },
  render(){
    if(!this.active)return;
    uctx.strokeStyle='rgba(243,227,200,0.5)';uctx.lineWidth=1;
    uctx.beginPath();uctx.arc(32,UI_H-32,22,0,Math.PI*2);uctx.stroke();
    uctx.fillStyle='rgba(26,20,18,0.55)';
    uctx.beginPath();uctx.arc(32,UI_H-32,22,0,Math.PI*2);uctx.fill();
    const kx=32+(this.joyId?this.axisX*14:0);
    const ky=UI_H-32+(this.joyId?this.axisZ*14:0);
    uctx.fillStyle='rgba(255,207,107,0.85)';
    uctx.beginPath();uctx.arc(kx,ky,7,0,Math.PI*2);uctx.fill();
    for(const b of this.buttons){
      const on=this.btn[b.id];
      uctx.fillStyle=on?'rgba(255,207,107,0.7)':'rgba(26,20,18,0.6)';
      uctx.beginPath();uctx.arc(b.x,b.y,b.r,0,Math.PI*2);uctx.fill();
      uctx.strokeStyle='rgba(243,227,200,0.7)';
      uctx.beginPath();uctx.arc(b.x,b.y,b.r,0,Math.PI*2);uctx.stroke();
      drawTextC(b.id,b.x,b.y-3,on?COL.uiBg:COL.uiGold);
    }
  }
};

function updateCamera(){

    const cp=Math.cos(camera.pitch),sp=Math.sin(camera.pitch);
    camPos.x=player.x+sy*cp*camera.dist;
    camPos.y=0.6+sp*camera.dist;
    camPos.z=player.z+cy*cp*camera.dist;
  }else{
    const cy=Math.cos(camera.yaw),sy=Math.sin(camera.yaw);
    const cp=Math.cos(camera.pitch),sp=Math.sin(camera.pitch);
    camPos.x=player.x+sy*cp*camera.dist;
    camPos.y=0.6+sp*camera.dist;
    camPos.z=player.z+cy*cp*camera.dist;
  }
}
function getVP(){
  const aspect=glCanvas.width/glCanvas.height;
  const proj=M4.perspective(Math.PI/3,aspect,0.1,80);
  const view=M4.lookAt([camPos.x,camPos.y,camPos.z],[player.x,0.6,player.z],[0,1,0]);
  const vp=new Float32Array(16);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    let s=0;for(let k=0;k<4;k++)s+=proj[k*4+j]*view[i*4+k];
    vp[i*4+j]=s;
  }
  return vp;
}
function getCamRU(){
  const fx=player.x-camPos.x,fy=0.6-camPos.y,fz=player.z-camPos.z;
  const fl=Math.sqrt(fx*fx+fy*fy+fz*fz)||1;
  const fwd=[fx/fl,fy/fl,fz/fl];
  const r=V3.norm(V3.cross([0,1,0],fwd));
  const u=V3.cross(fwd,r);
  return{right:r,up:u};
}

/* ---------- UPDATE ---------- */
function updatePlayer(dt){
  if(fishing.state!=='idle'){player.moving=false;player.frame=0;return}
  let x=0,z=0;
  if(keys['KeyA']||keys['ArrowLeft'])x-=1;
  if(keys['KeyD']||keys['ArrowRight'])x+=1;
  if(keys['KeyW']||keys['ArrowUp'])z-=1;
  if(keys['KeyS']||keys['ArrowDown'])z+=1;
  x+=Touch.axisX;z+=Touch.axisZ;
  const len=Math.sqrt(x*x+z*z);
  if(len<0.15){player.moving=false;player.animT=0;player.frame=0;return}
  player.moving=true;
  if(len>1){x/=len;z/=len}
  const cy=Math.cos(camera.yaw),sy=Math.sin(camera.yaw);
  const fx=-sy,fz=-cy;
  const rx=cy,rz=-sy;
  const wx=x*rx+z*fx;
  const wz=x*rz+z*fz;
  const wl=Math.sqrt(wx*wx+wz*wz)||1;
  const sp=SPEED*dt;
  tryMove(player,wx/wl*sp,wz/wl*sp,P_HW,P_HH);
  if(Math.abs(wx)>Math.abs(wz))player.dir=wx>0?'right':'left';
  else player.dir=wz>0?'down':'up';
  player.animT+=dt;
  player.frame=Math.floor(player.animT*8)%4;
}
function findNearestNPC(){
  let n=null,bd=INTERACT_R;
  for(const npc of npcs){
    const d=Math.hypot(npc.x-player.x,npc.z-player.z);
    if(d<bd){bd=d;n=npc}
  }
  return n;
}
function nearShop(){return Math.hypot(34.5-player.x,22.5-player.z)<1.8}
function nearHouse(){
  for(const o of objects){
    if(o.kind!=='house')continue;
    if(Math.hypot(o.doorX-player.x,o.doorZ-player.z)<2.0)return o;
  }
  return null;
}
function nearInteriorDoor(){
  if(player.scene!=='interior')return false;
  const tx=Math.floor(player.x),tz=Math.floor(player.z);
  return tz>=8&&(tx===6||tx===7);
}
function interact(){
  if(player.scene==='interior'){
    if(nearInteriorDoor()){exitInterior();return}
    message.show('TIDAK ADA APA-APA',1.0);
    return;
  }
  const npc=findNearestNPC();
  if(npc){startDialog(npc);return}
  if(nearShop()){shop.open=true;shop.tab=0;shop.cursor=0;Audio.sfx('menu');return}
  if(nearHouse()){enterInterior();return}
  const slot=inv.active_item();
  if(!slot){message.show('TANGAN KOSONG',1.0);return}
  const id=slot.id;
  if(id==='rod'){startFishing();return}
  if(id==='net'){tryCatchBug();return}
  if(id==='shovel'){tryDig();return}
  if(id==='axe'){tryChop();return}
  if(id==='seed'||id==='seed_pohon'){tryPlant();return}
  if(id==='water'){message.show('PENYIRAM DIPAKAI',1.0);return}
  message.show(ITEMS[id].name.toUpperCase()+' DIPAKAI',1.0);
}

/* ---------- RENDER SCENE ---------- */
function renderScene(){
  const vp=getVP();
  const tint=TimeSys.lightTint();
  const st=Season.tint();
  gl.clearColor(tint[0]*st[0]*0.55,tint[1]*st[1]*0.68,tint[2]*st[2]*0.85,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);

  gl.useProgram(voxelProg);
  gl.uniformMatrix4fv(vLoc.uVP,false,vp);
  gl.uniform3f(vLoc.uLight,0.5,0.9,0.4);
  gl.uniform3f(vLoc.uTint,tint[0]*st[0],tint[1]*st[1],tint[2]*st[2]);
  for(const ch of chunks){
    if(!ch)continue;
    gl.bindBuffer(gl.ARRAY_BUFFER,ch.posBuf);
    gl.enableVertexAttribArray(vLoc.aPos);
    gl.vertexAttribPointer(vLoc.aPos,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,ch.nrmBuf);
    gl.enableVertexAttribArray(vLoc.aNormal);
    gl.vertexAttribPointer(vLoc.aNormal,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,ch.colBuf);
    gl.enableVertexAttribArray(vLoc.aColor);
    gl.vertexAttribPointer(vLoc.aColor,3,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.TRIANGLES,0,ch.count);
  }

  // Billboards
  resetBB();
  // Player
  const pDirRow=player.dir==='down'?0:(player.dir==='up'?1:2);
  const pUV=spriteUVFrame(0,pDirRow,player.frame);
  addBB(player.x,0.95,player.z,1.5,pUV.fU0,pUV.fV0,pUV.fU1,pUV.fV1,[1,1,1,1]);
  // NPCs
  for(let i=0;i<npcs.length;i++){
    const npc=npcs[i];
    const dr=npc.dir==='down'?0:(npc.dir==='up'?1:2);
    const row=3+i*3;
    const uv=spriteUVFrame(row,dr,npc.frame);
    addBB(npc.x,0.9,npc.z,1.4,uv.fU0,uv.fV0,uv.fU1,uv.fV1,[1,1,1,1]);
  }
  // Bugs
  for(const b of bugs){
    const col=ICON_COL[b.id]||[0.8,0.6,0.8];
    addBB(b.x,0.35,b.z,0.35,WHITE_UV.u0,WHITE_UV.v0,WHITE_UV.u1,WHITE_UV.v1,[col[0],col[1],col[2],0.9]);
  }
  // Dig spots
  for(const d of digSpots){
    addBB(d.x,0.08,d.z,0.5,WHITE_UV.u0,WHITE_UV.v0,WHITE_UV.u1,WHITE_UV.v1,[0.5,0.35,0.2,0.9]);
  }
  // Weather particles
  for(const p of WX.particles){
    if(Weather.type==='rain'){
      addBB(p.x,p.y,p.z,p.size,WHITE_UV.u0,WHITE_UV.v0,WHITE_UV.u1,WHITE_UV.v1,[0.7,0.8,1.0,0.9]);
    }else{
      addBB(p.x,p.y,p.z,p.size,WHITE_UV.u0,WHITE_UV.v0,WHITE_UV.u1,WHITE_UV.v1,[0.85,0.75,0.4,0.9]);
    }
  }

  if(bbCount>0){
    uploadBB();
    gl.useProgram(bbProg);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.uniformMatrix4fv(bLoc.uVP,false,vp);
    const ru=getCamRU();
    gl.uniform3fv(bLoc.uCamR,ru.right);
    gl.uniform3fv(bLoc.uCamU,ru.up);
    gl.uniform1i(bLoc.uTex,0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,spriteTex);
    gl.bindBuffer(gl.ARRAY_BUFFER,bbPosBuf);
    gl.enableVertexAttribArray(bLoc.aPos);
    gl.vertexAttribPointer(bLoc.aPos,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,bbUVBuf);
    gl.enableVertexAttribArray(bLoc.aUV);
    gl.vertexAttribPointer(bLoc.aUV,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,bbCSBuf);
    gl.enableVertexAttribArray(bLoc.aCS);
    gl.vertexAttribPointer(bLoc.aCS,4,gl.FLOAT,false,0,0);
    // Draw groups by tint (approximate: split by particle vs character)
    // Simple approach: draw all with white tint (particles were colored via their own billboards? no)
    // For simplicity, draw all with white tint; particles will use their white UV and thus appear white
    // Better: skip particle tint or handle separately
    // We'll just draw everything with white tint; particles will show as white/snow-ish
    gl.uniform4f(bLoc.uTint,1,1,1,1);
    // Since we can't batch per-tint easily, just draw all with white
    // (particles will look white; that's acceptable for snow/rain)
    gl.drawArrays(gl.TRIANGLES,0,bbCount*6);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }
}

/* ---------- LOOP ---------- */
let lastT=0,acc=0;
function update(dt){
  game.time+=dt;
  if(game.paused)return;
  TimeSys.update();
  Season.update();
  Weather.update(dt);
  Audio.tick(dt);
  updateDialog(dt);
  updateFishing(dt);
  WX.update(dt);
  if(!game.tutorial)return;
  if(fishing.state==='idle'&&!dialog.active&&!invUI.open&&!shop.open&&!Collection.open){
    updatePlayer(dt);
    updateNPCs(dt);
  }
  updateBugs(dt);
  updateDig(dt);
  updateGrow(dt);
  updateCamera();
  if(message.timer>0)message.timer-=dt;
  autoSave(dt);
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastT)/1000;lastT=now;
  if(!isFinite(dt)||dt<0)dt=0;
  if(dt>0.25)dt=0.25;
  if(!game.paused){
    acc+=dt;
    let n=0;
    while(acc>=STEP&&n<5){update(STEP);acc-=STEP;n++}
    if(n>=5)acc=0;
  }else game.time+=dt;
  updateCamera();
  renderScene();
  renderUI();
}

/* ---------- INPUT ---------- */
function onKey(code){
  if(!game.tutorial&&game.state==='play'){
    if(code==='KeyE'||code==='Space'||code==='Enter'){
      game.tutorial=true;Audio.sfx('menu');Save.save();
    }
    return;
  }
  if(fishing.state==='bite'||fishing.state==='minigame'){
    if(code==='KeyE'||code==='Space'){fishingPress();return}
  }
  if(fishing.state!=='idle'){if(code==='Escape')fishing.state='idle';return}
  if(shop.open){
    if(code==='Escape'){shop.open=false;Audio.sfx('menu');return}
    if(code==='Tab'){shop.tab=(shop.tab+1)%2;shop.cursor=0;Audio.sfx('menu');return}
    if(code==='ArrowUp'||code==='KeyW')shop.cursor=Math.max(0,shop.cursor-1);
    else if(code==='ArrowDown'||code==='KeyS'){
      const mx=shop.tab===0?shop.buy.length-1:7;
      shop.cursor=Math.min(mx,shop.cursor+1);
    }
    else if(code==='Enter'||code==='Space'||code==='KeyE'){
      if(shop.tab===0)shopBuy();else shopSell();
    }
    return;
  }
  if(Collection.open){if(code==='Escape'||code==='KeyC')Collection.open=false;return}
  if(dialog.active){
    if(code==='KeyE'||code==='Space'||code==='Enter')advanceDialog();
    else if(code==='KeyG'){
      if(dialog.done&&dialog.idx>=dialog.lines.length-1){invUI.open=true;invUI.mode='gift';invUI.cursor=0}
    }else if(code==='Escape')closeDialog();
    return;
  }
  if(invUI.open){
    if(code==='Escape'||code==='KeyI'){if(invUI.mode==='gift')invUI.mode='normal';invUI.open=false;return}
    if(code==='ArrowLeft'||code==='KeyA')invUI.cursor=Math.max(0,invUI.cursor-1);
    else if(code==='ArrowRight'||code==='KeyD')invUI.cursor=Math.min(19,invUI.cursor+1);
    else if(code==='ArrowUp'||code==='KeyW')invUI.cursor=Math.max(0,invUI.cursor-5);
    else if(code==='ArrowDown'||code==='KeyS')invUI.cursor=Math.min(19,invUI.cursor+5);
    else if(code==='Enter'||code==='Space'||code==='KeyE'){
      if(invUI.mode==='gift'){
        if(inv.slots[invUI.cursor])giveGift(invUI.cursor);
        else message.show('SLOT KOSONG',1.2);
      }else{
        if(invUI.cursor<5&&inv.slots[invUI.cursor])inv.active=invUI.cursor;
      }
    }
    return;
  }
  if(game.paused){
    if(code==='Escape'){game.paused=false;lastT=performance.now();acc=0}
    return;
  }
  if(game.state==='title'){
    if(code==='Enter'||code==='Space'||code==='NumpadEnter'){
      Audio.sfx('enter');
      game.state='play';game.paused=false;game.time=0;
      if(game.hasSave)Save.load();
      Save.save();
    }else if(code==='KeyL'&&game.hasSave){
      Audio.sfx('enter');
      game.state='play';game.paused=false;game.time=0;
      Save.load();
    }
    return;
  }
  if(code==='Escape'){game.paused=true;acc=0;Audio.sfx('menu')}
  else if(code==='KeyE'||code==='Space')interact();
  else if(code==='KeyQ')inv.cycle();
  else if(code==='Digit1'||code==='Digit2'||code==='Digit3'||code==='Digit4'||code==='Digit5'){
    const i=parseInt(code.charAt(5),10)-1;
    if(inv.slots[i])inv.active=i;
  }
  else if(code==='KeyI'){invUI.open=true;invUI.mode='normal';invUI.cursor=0;Audio.sfx('menu')}
  else if(code==='KeyC'){Collection.open=true;Audio.sfx('menu')}
  else if(code==='KeyM')Audio.toggle();
  else if(code==='KeyF'){if(Save.save())message.show('DISIMPAN',1.2);else message.show('GAGAL SIMPAN',1.5)}
}

/* ---------- INIT ---------- */
function initInventory(){
  inv.slots[0]={id:'net',n:1};
  inv.slots[1]={id:'rod',n:1};
  inv.slots[2]={id:'shovel',n:1};
  inv.slots[3]={id:'axe',n:1};
  inv.slots[4]={id:'water',n:1};
  inv.slots[5]={id:'daun',n:3};
  inv.slots[6]={id:'bunga',n:2};
  inv.slots[7]={id:'apel',n:2};
  inv.slots[8]={id:'umpan',n:3};
  inv.slots[9]={id:'seed_pohon',n:2};
  inv.active=0;
}
function init(){
  resize();
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)Save.save();
    lastT=performance.now();acc=0;
  });
  window.addEventListener('beforeunload',()=>Save.save());

  bakeSpriteAtlas();
  spriteTex=makeTexture(atlasCanvas);

  genVillage();
  buildAllChunks();

  for(const def of NPC_DEFS)npcs.push(makeNPC(def));
  initInventory();
  buildCollectionList();
  Touch.init();
  game.hasSave=Save.exists();
  Season.update();

  player.x=28;player.z=23;player.dir='down';
  updateCamera();
  lastT=performance.now();acc=0;
  requestAnimationFrame(frame);
}
init();
</script>
